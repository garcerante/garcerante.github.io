<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escenario</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23b45309%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1c1c1e; --muted:#6c6c72; --border:#e2dfd8;
  --accent:#b45309; --accent-soft:#fdf0e1; --ok:#15803d; --rec:#dc2626; --dub:#d97706; --info:#2563eb;
  --guide:rgba(180,83,9,.05); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --radius:10px; --lyric-size:24px; --chord:var(--accent); --lyric:var(--text);
}
[data-theme="dark"]{
  --bg:#111113; --surface:#1a1a1d; --surface2:#232327; --text:#ededed; --muted:#9b9ba3; --border:#2d2d33;
  --accent:#f2a93b; --accent-soft:#2b2214; --ok:#22c55e; --rec:#ef4444; --dub:#f59e0b; --info:#60a5fa;
  --guide:rgba(242,169,59,.06); --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:grid;grid-template-rows:56px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 360px;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;line-height:1.2}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] button.primary{color:#1a1205}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--surface2)}
button.icon{padding:6px 8px;min-width:32px}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
input[type=range]{accent-color:var(--accent)}
kbd{font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:4px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--accent-soft);color:var(--accent)}

/* Top bar */
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.songhead{min-width:0;flex:1;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.songhead b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songhead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
.group button{border:none;background:transparent;padding:4px 8px}
.group button:hover{background:var(--surface)}
.keyval{min-width:84px;text-align:center;font-weight:600}
.keyval small{font-weight:400;color:var(--muted)}

/* Lyrics */
main{grid-row:2;grid-column:1;position:relative;display:flex;flex-direction:column;min-height:0}
#lyricsWrap{flex:1;min-height:0;position:relative}
#lyrics{position:absolute;inset:0;overflow-y:auto;padding:28px 40px 0 52px;scrollbar-width:thin}
#lyrics::after{content:"";display:block;height:70vh}
#guide{position:absolute;left:0;right:0;top:33%;height:calc(var(--lyric-size)*2.7);transform:translateY(-50%);background:var(--guide);pointer-events:none;border-top:1px dashed transparent}
.song{font-size:var(--lyric-size);max-width:1100px;color:var(--lyric)}
.ln{margin:0 0 .15em;white-space:normal}
.seg{display:inline-block;vertical-align:bottom;white-space:pre}
.seg .ch{display:block;color:var(--chord);font-weight:700;font-size:.82em;line-height:1.15;min-height:1.15em;padding-right:.45em}
.seg .tx{display:block;line-height:1.3;min-height:1.3em}
.seg .ch.nc{color:var(--muted);font-weight:500}
.ln.chords .seg .ch{padding-right:1.1em}
.ln.chords .seg .tx{display:none}
.ln.lyric{line-height:1.3;white-space:pre-wrap}
.ln.blank{height:.8em}
.ln.section{display:inline-block;margin:.7em 0 .35em;font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.ln.tab{font:0.62em/1.35 ui-monospace,Menlo,monospace;white-space:pre;color:var(--muted)}
.empty{max-width:560px;margin:8vh auto;text-align:center;font-size:15px}
.empty h2{font-size:22px;margin:0 0 8px}
.empty .row{justify-content:center;margin-top:16px}
.lyricsbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface);font-size:13px;flex-wrap:wrap}
.lyricsbar .group button{font-size:13px}
.ln[data-t]{border-left:3px solid transparent;margin-left:-14px;padding-left:11px;border-radius:2px;transition:border-color .2s}
.ln.now{border-left-color:var(--chord)}
#lyrics{overflow-x:hidden}
.hl1 .ln[data-t],.hl2 .ln[data-t]{transform-origin:0 60%;transition:transform .35s ease,opacity .35s ease,-webkit-text-stroke-width .35s ease,border-color .2s}
.hl1 .ln.now{transform:scale(1.06);-webkit-text-stroke:.022em currentColor;paint-order:stroke fill}
.hl2 .ln.now{transform:scale(1.12);-webkit-text-stroke:.032em currentColor;paint-order:stroke fill}
.hl2 .ln[data-t]:not(.now){opacity:.62}
.editing .ln.now{transform:none!important;-webkit-text-stroke:0!important}
.editing .ln[data-t]{opacity:1!important}
.plbar{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.plbar select{flex:1;min-width:0;font-size:13px}
.pllist{display:flex;flex-direction:column;gap:6px}
.pllist .row{padding:8px 10px;border:1px solid var(--border);border-radius:10px}
.pllist .row.act{border-color:var(--accent);background:var(--accent-soft)}
.editing #guide{display:none}
.editing #lyrics{padding-left:58px}
.editing #lyrics .ch[data-ci]{cursor:grab;border-radius:5px;transition:background .12s, box-shadow .12s}
.editing #lyrics .ch[data-ci]:hover{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.editing #lyrics .ch[data-ci].sel{background:var(--chord);color:var(--bg)}
.editing #lyrics .tx{cursor:text}
.editing #lyrics .ln[data-li]{position:relative;border-radius:6px}
.editing #lyrics .ln[data-li]:hover{background:var(--guide)}
.addend{font-size:12px;line-height:1;padding:3px 7px;border-radius:999px;margin-left:.6em;vertical-align:bottom;opacity:0;transition:opacity .15s;border-style:dashed;color:var(--chord);border-color:var(--chord);background:transparent}
.editing #lyrics .ln[data-li]:hover .addend{opacity:1}
#caretGhost{position:fixed;width:2px;border-radius:1px;background:var(--chord);pointer-events:none;z-index:40;display:none}
#caretGhost b{position:absolute;top:-2px;left:-7px;width:16px;height:16px;border-radius:50%;background:var(--chord);color:var(--bg);font:700 13px/16px -apple-system,sans-serif;text-align:center}
.dragghost{position:fixed;z-index:60;pointer-events:none;background:var(--chord);color:var(--bg);font-weight:700;padding:2px 8px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-120%)}
.chordpop{width:300px}
.chordpop input{font-size:20px;font-weight:700;color:var(--chord);text-align:center;padding:8px}
.chordpop .chips{display:flex;flex-wrap:wrap;gap:6px}
.chordpop .chips button{font-weight:600;color:var(--chord);padding:4px 9px;border-radius:999px}
.chordpop .chips button:hover{background:var(--accent-soft);border-color:var(--chord)}
.chordpop small{color:var(--muted)}
.wave{position:relative;height:160px;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:crosshair;user-select:none;touch-action:none;overflow:hidden}
.wave canvas{position:absolute;inset:0}
.wave .ticks i{position:absolute;top:0;width:2px;height:14px;background:var(--chord);border-radius:1px;transform:translateX(-1px)}
.wave .ticks i.lost{background:var(--rec)}
.wave .cutz{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(220,38,38,.18) 0 6px,rgba(220,38,38,.06) 6px 12px);border-left:2px solid var(--rec);border-right:2px solid var(--rec);pointer-events:none}
.wave .cutz span{position:absolute;bottom:4px;left:4px;font-size:11px;font-weight:700;color:var(--rec);white-space:nowrap}
.wave .selz{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.18);border-left:2px solid var(--info);border-right:2px solid var(--info);pointer-events:none}
.wave .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--text);pointer-events:none;transform:translateX(-1px)}
.editbar{background:var(--accent-soft)}
#ceTap.on{background:var(--chord);color:var(--bg);border-color:var(--chord)}
.editing #lyrics .ln.tapnext{outline:2px dashed var(--chord);outline-offset:6px}
.editing #lyrics .ln.tapnext::after{content:'↵ Enter al empezar esta línea';position:absolute;right:8px;top:-9px;transform:translateY(-100%);background:var(--bg);padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;color:var(--chord);white-space:nowrap}
.editing #lyrics .ln.tapped{animation:tapflash .7s ease-out}
@keyframes tapflash{0%{background:var(--chord)}100%{background:transparent}}
.editbar .group button{font-size:13px}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--muted);min-width:76px;text-align:center}
.lplay{position:absolute;left:-40px;top:50%;transform:translateY(-10%);font-size:11px;line-height:1;padding:5px 6px;border-radius:50%;opacity:0;transition:opacity .15s;color:var(--chord);border-color:var(--chord);background:var(--surface)}
.editing #lyrics .ln[data-li]:hover .lplay,.editing #lyrics .ln.now .lplay{opacity:1}
.eplayer{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--border);background:var(--bg)}
.eplayer .bar{height:8px;border-radius:4px;background:var(--surface2);cursor:pointer;position:relative;overflow:hidden;min-width:120px}
.eplayer .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.editbar b{color:var(--accent)}
.vox{display:flex;align-items:center;gap:6px;font-size:12px}
.dsel{font-size:12px;padding:3px 6px}
.ln[data-t]{position:relative}
.vtag{position:absolute;left:-42px;top:auto;bottom:.15em;font-size:15px;font-weight:700;line-height:1;padding:3px 5px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;opacity:.85}
.vtag.vm{color:#3b82f6}.vtag.vf{color:#e0559a}.vtag.vb{color:var(--muted)}
.ln.mine{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);border-radius:6px}
#btnFade.pulse{animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{50%{filter:brightness(1.18);box-shadow:0 0 0 4px var(--accent-soft)}}
.vox button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.vox button{white-space:nowrap;padding:4px 8px}
.vox button.off{color:var(--muted);border-style:dashed}
.vox .vlab{white-space:nowrap;min-width:52px;text-align:right}
#jobs{position:fixed;right:376px;top:68px;max-height:calc(100vh - 330px);overflow-y:auto;z-index:45;display:flex;flex-direction:column;gap:8px;width:340px}
.job{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.job b{font-size:13px}
.job .steps{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px}
.job .steps .act{color:var(--text);font-weight:600}
.job .steps .done{color:var(--ok)}
.job .steps .err{color:var(--rec)}
.jbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.jbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.aibox{border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.aibox .row{flex-wrap:wrap}

/* Right column */
aside{grid-row:2;grid-column:2;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.decks{display:flex;flex-direction:column;gap:10px;padding:12px}
.deck{border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.deck.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.deck .role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.deck.cur .role{color:var(--accent)}
.deck .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .bar{height:8px;border-radius:4px;background:var(--surface2);cursor:pointer;position:relative;overflow:hidden}
.deck .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.deck .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.6}
.deck .time{font:12px ui-monospace,Menlo,monospace;color:var(--muted);min-width:92px;text-align:right}
.deck .yt{width:100%;height:200px;border-radius:8px;overflow:hidden;background:#000}
.deck .yt iframe{width:100%;height:100%;border:0}
.deck .vol{width:80px}
.play{min-width:44px;font-size:16px}
.fade{order:1;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--border);border-radius:var(--radius)}
.fade button.primary{font-weight:600;padding:9px}
.fadeprog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.fadeprog i{display:block;height:100%;width:0;background:var(--accent)}
.sect{padding:4px 12px 12px}
.sect h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0;display:flex;align-items:center;gap:6px}
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.setlist li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.setlist li:hover{background:var(--surface2)}
.setlist li.cur{border-color:var(--accent);background:var(--accent-soft)}
.setlist li.next{border-color:var(--border);border-style:dashed}
.setlist .n{width:18px;color:var(--muted);font-size:12px;text-align:right}
.setlist .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setlist .acts{display:none;gap:2px}
.setlist li:hover .acts{display:flex}
.setlist .acts button{padding:2px 6px;font-size:12px}
.tag{font-size:11px;color:var(--muted)}

/* Bottom: looper + pads */
footer{grid-column:1/3;grid-row:3;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:14px;padding:10px 14px;min-height:0}
footer.collapsed .fbody{display:none}
.fcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.fhead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fhead .chip{text-transform:none;letter-spacing:0;font-weight:500}
.looper{flex:1.35}
.pads{flex:1}
.fbody{display:flex;gap:10px;min-height:0}
.micbox{display:flex;flex-direction:column;gap:6px;width:200px;font-size:12px}
.micbox select{width:100%;font-size:12px;padding:4px}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s}
.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.trk{border:1px solid var(--border);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--bg)}
.trk .big{height:58px;border-radius:10px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--border);background:var(--surface)}
.trk .big small{font-weight:500;color:var(--muted)}
.trk[data-state="rec"] .big,.trk[data-state="dub"] .big{border-color:var(--rec);color:var(--rec);animation:pulse 1s infinite}
.trk[data-state="dub"] .big{border-color:var(--dub);color:var(--dub)}
.trk[data-state="play"] .big{border-color:var(--ok);color:var(--ok)}
.trk[data-state="mute"] .big{color:var(--muted);border-style:dashed}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(220,38,38,.15)}}
.trk .phase{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.trk .phase i{display:block;height:100%;width:0;background:var(--muted)}
.trk .mini{display:flex;gap:4px;align-items:center}
.trk .mini button{padding:2px 6px;font-size:12px}
.trk .mini input{width:100%;min-width:0}
.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.pad{position:relative;height:62px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:4px 6px;text-align:center;user-select:none;touch-action:none}
.pad .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad .md{font-size:10px;color:var(--muted)}
.pad.emptyp{border-style:dashed;color:var(--muted)}
.pad.on{border-color:var(--accent);background:var(--accent-soft)}
.pad .cfg{position:absolute;top:2px;right:2px;padding:0 5px;font-size:11px;border:none;background:transparent;color:var(--muted)}
.pad kbd{position:absolute;bottom:3px;left:4px;margin:0}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(1100px,94vw);max-height:92vh;display:flex;flex-direction:column}
.modal header,.modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);grid-column:auto;background:transparent;height:auto}
.modal h2{margin:0;font-size:17px;flex:1}
.mbody{padding:16px 18px;overflow:auto;display:flex;gap:16px;min-height:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.form{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label > *{color:var(--text);font-size:14px}
.form .row > label{min-width:0}
.form .row > label input{width:100%;min-width:0}
.form textarea{min-height:300px;font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical;white-space:pre;overflow:auto}
.preview{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;max-height:66vh;background:var(--bg)}
.preview .song{font-size:16px}
.radio{display:flex;gap:6px}
.radio label{flex-direction:row;align-items:center;gap:4px;color:var(--text);font-size:13px;border:1px solid var(--border);padding:5px 9px;border-radius:8px;cursor:pointer}
.radio input{margin:0}
.lib{flex-direction:column}
.liblist{display:flex;flex-direction:column;gap:4px}
.libitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px}
.libitem .t{flex:1;min-width:0}
.libitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;font-size:14px}
.settings .hint{grid-column:2;font-size:12px;color:var(--muted);margin-top:-6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.keys kbd{margin:0}
#toast{position:fixed;left:50%;bottom:220px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.show{opacity:.95}

class AbstractFifoSamplePipe {
  constructor(createBuffers) {

  }

  }
  get outputBuffer() {

  }
  set outputBuffer(outputBuffer) {
    this._outputBuffer = outputBuffer;
  }
  clear() {
    this._inputBuffer.clear();
    this._outputBuffer.clear();
  }
}

function shiftPitch(L, R, semis, onProgress){
  const st = new SoundTouch(); st.pitchSemitones = semis; st.tempo = 1;

      return Math.min(numFrames, Math.max(0, n + pad - position)); } };

  while (out < n){

    const m = Math.min(got, n-out);
    for (let i=0;i<m;i++){ oL[out+i]=buf[2*i]; oR[out+i]=buf[2*i+1]; }

// ===== Chord engine: parse, transpose, render-model =====
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

/* ---- Pitch shifting worker (SoundTouch, LGPL) ---- */
const pitchWorker = (() => {
  const src = $('#stlib').textContent + '\n' + $('#pitchcore').textContent + `
    onmessage = e => { const {id, L, R, semis} = e.data;
      try { const out = shiftPitch(L, R, semis, p => postMessage({id, progress:p}));
        postMessage({id, done:true, L:out[0], R:out[1]}, [out[0].buffer, out[1].buffer]); }
      catch(err){ postMessage({id, error:String(err)}); } };`;
  try { return new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'}))); }
  catch(e){ console.warn('Worker no disponible', e); return null; }
})();
const pitchJobs = new Map();

  const job = pitchJobs.get(e.data.id); if (!job) return;
  if (e.data.progress != null){ job.onProgress && job.onProgress(e.data.progress); return; }
  pitchJobs.delete(e.data.id);
  if (e.data.error) return job.reject(new Error(e.data.error));

    pitchedCache.set(key, decodeAsset(assetId).then(base => new Promise((resolve, reject) => {
      if (!pitchWorker) return reject(new Error('Sin soporte de Worker'));

}

  const keep = new Set();

/* Teleprompter target: the sung line sits on the reading band; shortly before the next line starts,
   the text glides smoothly to it (never earlier, so it doesn't run ahead of the singer). */
function teleTarget(T, tNow, el){
  const ctr = e => e.offsetTop + e.offsetHeight / 2, ARR = 0.15;
  let i = 0; while (i + 1 < T.length && T[i+1].t <= tNow + ARR) i++;
  let y = ctr(T[i].el);
  const nx = T[i+1];
  if (nx && T[i].t <= tNow + ARR){
    const gap = nx.t - T[i].t, glide = Math.min(1.2, Math.max(0.25, gap * 0.4));
    const p = clamp((tNow + ARR - (nx.t - glide)) / glide, 0, 1), ease = p * p * (3 - 2 * p);
    y += (ctr(nx.el) - y) * ease;
  }
  return y - el.clientHeight * 0.33;
}
/* ================= Autoscroll loop ================= */
function scrollTick(){
  const el = $('#lyrics'), d = DECK_CUR(), song = curSong();
  const nowMs = performance.now(), dt = Math.min(0.1, (nowMs - (S.lastTick || nowMs)) / 1000); S.lastTick = nowMs;
  if (Math.abs(S.nudge) > 0.5){ const step = S.nudge * 0.18; S.nudge -= step; el.scrollTop += step; } else S.nudge = 0;
  if (song && d && d.song === song){
    // detect manual scroll since last frame
    if (S.lastSet != null && Math.abs(el.scrollTop - S.lastSet) > 1.5){
      if (d.playing && S.scrollMode === 'auto' && !CE.on) S.userOffset += el.scrollTop - S.lastSet;   // paused: free reading, no offset
      S.lastManualAt = nowMs;
    }
    const tNow = d.time;
    if (S.timed && S.timed.length >= 2 && d.kind !== 'none'){
      // highlight the line being sung
      let idx = -1; for (let i = 0; i < S.timed.length; i++){ if (S.timed[i].t <= tNow + 0.15) idx = i; else break; }
      const nl = idx >= 0 ? S.timed[idx].el : null;
      if (nl !== S.nowLine){ S.nowLine && S.nowLine.classList.remove('now'); nl && nl.classList.add('now'); S.nowLine = nl; }
    }
    const tele = S.timed && S.timed.length >= 2 && d.kind !== 'none';
    // in the chord editor the lyrics also follow the song, but hold still while you work (popover, drag, or you scrolled)
    const ceHold = CE.on && (CE.pop || CE.drag || nowMs - (S.lastManualAt || 0) < 4000);
    if (d.playing && tele && ((S.scrollMode === 'auto' && !CE.on) || (CE.on && !ceHold))){
      if (!CE.on){
        if (nowMs - (S.lastManualAt || 0) > 3500) S.userOffset *= Math.pow(0.08, dt);   // drift back so the sung line never leaves the screen
        S.userOffset = clamp(S.userOffset, -el.clientHeight * 0.3, el.clientHeight * 0.5);
      } else S.userOffset = 0;
      const want = teleTarget(S.timed, tNow, el) + S.userOffset;
      el.scrollTop += (want - el.scrollTop) * (1 - Math.exp(-dt * 10));
    } else if (S.scrollMode === 'auto' && d.playing && !CE.on){
      const dur = d.duration || songDuration(song);
      const start = song.scrollStart ?? 0, end = song.scrollEnd ?? dur;
      const p = clamp((d.time - start) / Math.max(1, end - start), 0, 1);
      const sEl = el.firstElementChild, C = sEl ? sEl.offsetTop + sEl.offsetHeight : 0;

    S.lastSet = el.scrollTop;
    // auto transition
    if (S.settings.autoFade && d.playing && !S.fading && DECK_NEXT().song && d.duration > 0 && d.kind !== 'none'){
      if (d.eDuration - d.eTime <= S.settings.fadeSec + 0.2) transition();
    }
    if (d.kind === 'none' && d.playing && d.time >= d.duration){ d.pause(); d.offset = d.duration; d.onEnded(); }
  }
  for (const dk of DECKS) dk.tick();
  if (CE.on && d){ $('#cePlay').textContent = d.playing ? '❚❚' : '▶'; $('#ceTime').textContent = fmtT(d.time) + ' / ' + fmtT(d.duration); }
  const info = $('#scrollInfo');
  if (song && d){
    const kindTxt = d.kind === 'file' ? 'sincronizado con la pista' : d.kind === 'yt' ? 'sincronizado con YouTube' : 'por tiempo';
    info.textContent = S.scrollMode === 'auto' ? (d.playing ? 'Avanzando · ' + kindTxt : 'En pausa · ' + kindTxt) : 'Manual (pedal / rueda)';

/* ================= Song / deck flow ================= */
function nextInSetlist(id){
  const i = S.setlist.indexOf(id);
  if (i < 0) return S.setlist[0] && S.setlist[0] !== id ? S.setlist[0] : null;
  return S.setlist[i+1] || null;
}
async function setCurrent(id, {load=true} = {}){

  if (load){ const d = DECK_CUR(); await d.load(S.songs.get(id) || null); }
  if (S.curId !== id) return; // a newer selection superseded this one
  DECKS.forEach(d => d.render());
  const nx = nextInSetlist(id);
  const nd = DECK_NEXT();
  if (!nd.playing && (!nd.song || nd.song.id !== nx)) await nd.load(nx ? S.songs.get(nx) : null);
  renderSetlist(); prunePitchCache();
}
async function setNext(id){

  await nd.load(S.songs.get(id)); renderSetlist(); prunePitchCache();
}
async function transition(){
  if (S.fading) return;
  if (CE.on) exitChordEdit();
  const A = DECK_CUR(), B = DECK_NEXT();
  if (A.vamping){ A.vampRelease(); return; }   // second press: into the song, on the next bar
  if (!B.song){ toast('Elige la siguiente canción en el setlist.'); return; }
  if (B.kind === 'file' && !B.buf){ toast('La siguiente pista aún se está preparando…'); return; }
  S.fading = true;
  const fade = A.playing ? S.settings.fadeSec : 0.3;
  B.setLevel(A.playing ? 0 : 1);
  if (!B.playing){
    let plan = null;
    if (S.settings.vamp && B.kind === 'file'){ try { plan = await B.vampPlan(); } catch(e){ console.warn('vamp', e); } if (!plan) toast('No encontré un ritmo claro para el vamp; entra la canción directamente.'); }
    if (plan) B.startVamp(plan); else { B.offset = 0; await B.play(); }
  }
  curDeckIdx = 1 - curDeckIdx; updateFadeBtn();
  S.curId = B.song.id; saveSetlist();
  renderLyrics(); DECKS.forEach(d => d.render()); renderSetlist();
  const t0 = performance.now(), prog = $('#fadeProg');
  await new Promise(res => {
    const step = () => {
      const x = clamp((performance.now() - t0) / (fade*1000), 0, 1);
      A.setLevel(Math.cos(x * Math.PI/2)); B.setLevel(Math.sin(x * Math.PI/2));
      prog.style.width = (x*100) + '%';
      if (x < 1) setTimeout(step, 30); else res();
    };
    step();
  });
  A.stop(); A.setLevel(1); prog.style.width = '0';
  S.fading = false; updateFadeBtn();
  const nx = nextInSetlist(S.curId);
  await A.load(nx ? S.songs.get(nx) : null);
  DECKS.forEach(d => d.render()); renderSetlist(); prunePitchCache();
}
async function changeTranspose(delta){
  const s = curSong(); if (!s) return;
  s.transpose = delta === 0 ? 0 : clamp((s.transpose||0) + delta, -11, 11);
  await saveSong(s); renderLyrics(true);
  for (const d of DECKS) if (d.song && d.song.id === s.id){
    d.song = s;
    if (d.kind === 'file') { const tok = ++d.token; d.loadPitch(tok).catch(e => d.setStatus('Error: ' + e.message, true)); }
    else if (d.kind === 'yt') d.setStatus(s.transpose ? 'YouTube: suena en tono original' : '', !!s.transpose);
  }
  prunePitchCache();
}

$('#setlist').addEventListener('click', async e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const id = li.dataset.id, a = e.target.dataset.a, i = S.setlist.indexOf(id);
  if (a === 'now'){ if (DECK_CUR().playing && !(await confirmBox('La pista actual está sonando. ¿Abrir esta canción ahora (se detiene la actual)?'))) return; DECK_CUR().stop(); setCurrent(id); }
  else if (a === 'up' && i > 0){ S.setlist.splice(i,1); S.setlist.splice(i-1,0,id); saveSetlist(); renderSetlist(); }
  else if (a === 'down' && i < S.setlist.length-1){ S.setlist.splice(i,1); S.setlist.splice(i+1,0,id); saveSetlist(); renderSetlist(); }
  else if (a === 'rm'){ S.setlist.splice(i,1); saveSetlist(); renderSetlist(); }
  else if (!a){ if (id === S.curId) return; if (!DECK_CUR().song) setCurrent(id); else setNext(id); }
});

function modal(html, {wide=true} = {}){
  const api = {onClose:null};
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="${wide ? '' : 'width:min(560px,94vw)'}">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); api.onClose && api.onClose(); };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  api.el = ov; api.close = close; return api;
}
function confirmBox(msg, ok='Sí', cancel='Cancelar'){
  return new Promise(res => {
    const m = modal(`<div class="mhead"><h2>Confirmar</h2></div><div class="mbody">${esc(msg)}</div>
      <div class="mfoot"><button data-r="0">${esc(cancel)}</button><button class="primary" data-r="1">${esc(ok)}</button></div>`, {wide:false});
    m.el.addEventListener('click', e => { if (e.target.dataset.r != null){ m.close(); res(e.target.dataset.r === '1'); } });
  });
}

async function deleteSong(id){
  const s = S.songs.get(id);
  S.songs.delete(id); await DB.del('songs', id);
  if (s && s.track && s.track.assetId && ![...S.songs.values()].some(x => x.track && x.track.assetId === s.track.assetId)) await DB.del('assets', s.track.assetId);
  if (s && s.stems){ for (const a of [s.stems.inst, s.stems.voc, s.stems.back].filter(Boolean)) await DB.del('assets', a); }
  for (const p of S.playlists) if (p.songs.includes(id)){ p.songs = p.songs.filter(x => x !== id); p.at = Date.now(); }
  savePlaylists();
  S.setlist = S.setlist.filter(x => x !== id); saveSetlist();
  for (const d of DECKS) if (d.song && d.song.id === id) await d.load(null);
  if (S.curId === id){ S.curId = S.setlist[0] || null; await setCurrent(S.curId); }
  renderSetlist();
}
function blobToDataURL(b){ return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
async function exportBackup(withAudio){
  const data = {app:'escenario', version:1, exported:new Date().toISOString(), songs:[...S.songs.values()], setlist:S.setlist, assets:[]};
  if (withAudio){
    const ids = new Set([...S.songs.values()].filter(s => s.track && s.track.assetId).map(s => s.track.assetId));
    for (const s of S.songs.values()) if (s.stems){ for (const a of [s.stems.inst, s.stems.voc, s.stems.back].filter(Boolean)) ids.add(a); }
    PADS.forEach(p => p.assetId && ids.add(p.assetId)); data.pads = PADS;
    for (const id of ids){ const a = await DB.get('assets', id); if (a) data.assets.push({id, name:a.name, type:a.type, data: await blobToDataURL(a.blob)}); }
  }
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'escenario-respaldo-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Respaldo exportado.');
}
async function importBackup(file){
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'escenario') throw new Error('No es un respaldo de Escenario');
    for (const a of data.assets || []){ const blob = await (await fetch(a.data)).blob(); await DB.put('assets', {id:a.id, name:a.name, type:a.type, blob}); }
    for (const s of data.songs || []) await saveSong(s);
    for (const id of data.setlist || []) if (!S.setlist.includes(id) && S.songs.has(id)) S.setlist.push(id);
    if (data.pads){ for (let i = 0; i < 8; i++) if (data.pads[i] && data.pads[i].assetId) PADS[i] = data.pads[i]; savePads(); renderPads(); }
    saveSetlist(); renderSetlist();
    if (!S.curId && S.setlist[0]) setCurrent(S.setlist[0]);
    toast(`Importadas ${(data.songs||[]).length} canciones.`);
  } catch(e){ toast('No se pudo importar: ' + e.message, 4000); }
}

function onChunk(f, d){

    for (let L = L0 * 0.985; L <= L0 * 1.015; L += 0.5){
      let s = 0, n = 0;
      if (plan.mode === 'intro'){ const b = at(plan.b); for (let i = 0; i < L; i++){ s += BEAT.interp(fine.env, b - L + i) * BEAT.interp(fine.env, b + i); n++; } }
      else { const a = at(plan.a); for (let i = 0; i < L; i++){ s += BEAT.interp(fine.env, a + i) * BEAT.interp(fine.env, a + L + i); n++; } }
      s /= n || 1; if (s > bs){ bs = s; bestL = L; }
    }
    const L = bestL / fps;
    if (plan.mode === 'intro') plan.a = plan.b - L; else plan.b = plan.a + L;
    plan.L = L; plan.bpm = Math.round(60 / (L / plan.beats));
    return plan;
  },
  startVamp(plan){
    audio(); this.ensureOut(); this.stopSrc();
    const now = ctx.currentTime, t0 = now + 0.05, X = 0.015;
    const srcs = this.bufs.map(({buf, role}) => {
      const sr = buf.sampleRate, n = Math.round(plan.L * sr), s0 = Math.round(plan.a * sr), xn = Math.min(Math.round(X * sr), s0, n >> 2);
      const lb = ctx.createBuffer(buf.numberOfChannels, n, sr);
      for (let ch = 0; ch < buf.numberOfChannels; ch++){
        const src = buf.getChannelData(ch), out = lb.getChannelData(ch);

        for (let i = 0; i < xn; i++){ const k = (i + 0.5) / xn, j = n - xn + i;   // blend the loop's tail into what precedes its start → seamless seam
          out[j] = out[j] * Math.cos(k * Math.PI / 2) + src[s0 - xn + i] * Math.sin(k * Math.PI / 2); }
      }

  vampRelease(){

    v.rel = tb;
    for (const o of v.srcs){ o.g.gain.setValueAtTime(o.g.gain.value, tb - 0.004); o.g.gain.linearRampToValueAtTime(0, tb + 0.008); try { o.s.stop(tb + 0.05); } catch(e){} }
    this.startAt(v.mode === 'intro' ? v.b : v.entry, false, tb);
    this.setStatus('Entrando en ' + Math.max(0, tb - now).toFixed(1) + ' s…');
    setTimeout(() => { if (this.vamp === v){ this.vamp = null; this.setStatus(''); updateFadeBtn(); this.render(); } }, (tb - now) * 1000 + 80);
    updateFadeBtn();
  },
  cancelVamp(){ const v = this.vamp; if (!v) return; for (const o of v.srcs){ try { o.g.gain.setTargetAtTime(0, ctx.currentTime, 0.01); o.s.stop(ctx.currentTime + 0.08); } catch(e){} } this.vamp = null; this.setStatus(''); updateFadeBtn(); }
});

/* ================= Duets: tell his lines from hers by pitch, then mute one of them ================= */
const VOICE_NAMES = {m: 'él', f: 'ella', b: 'ambos'};
function yinF0(x, sr, o, W, minLag, maxLag, d){
  for (let t = 1; t <= maxLag; t++){ let s = 0; for (let i = 0; i < W; i++){ const q = x[o + i] - x[o + i + t]; s += q * q; } d[t] = s; }
  let run = 0; d[0] = 1;
  for (let t = 1; t <= maxLag; t++){ run += d[t]; d[t] = run ? d[t] * t / run : 1; }
  for (let t = minLag; t < maxLag; t++){
    if (d[t] < 0.18){ while (t + 1 < maxLag && d[t + 1] < d[t]) t++;
      const a = d[t - 1], b = d[t], c = d[t + 1], den = a - 2 * b + c, sh = den ? 0.5 * (a - c) / den : 0;
      return {f0: sr / (t + sh), ap: b}; }
  }
  return null;
}
async function detectVoices(song, onProg){
  if (!song.stems || !song.stems.voc) throw new Error('Primero analiza la canción para separar la voz');
  const buf = await decodeAsset(song.stems.voc);
  const m = BEAT.mono(buf), sr = m.sr, x = m.x;   // ~22 kHz
  // decimate to ~11 kHz for speed
  const y = new Float32Array(x.length >> 1); for (let i = 0; i < y.length; i++) y[i] = 0.5 * (x[2 * i] + x[2 * i + 1]); const fs = sr / 2;
  const lines = parseSong(song.raw || '').lines.filter(l => l.t != null && l.type !== 'section').map(l => l.t).sort((a, b) => a - b);
  if (lines.length < 2) throw new Error('La canción necesita tiempos por línea (analízala o márcalos)');
  const W = 512, hop = 256, minLag = Math.floor(fs / 900), maxLag = Math.ceil(fs / 70), d = new Float32Array(maxLag + 2);
  // loudness gate
  let peak = 0; const rmsAt = o => { let s = 0; for (let i = 0; i < W; i++) s += y[o + i] * y[o + i]; return Math.sqrt(s / W); };
  for (let o = 0; o + W < y.length; o += hop * 8) peak = Math.max(peak, rmsAt(o));
  const gate = peak * 0.06;
  const segs = lines.map((t, i) => ({t0: t, t1: i + 1 < lines.length ? lines[i + 1] : Math.min(buf.duration, t + 8), f: []}));
  for (let si = 0; si < segs.length; si++){
    const sg = segs[si];
    for (let o = Math.floor(sg.t0 * fs); o + W + maxLag < y.length && o < sg.t1 * fs; o += hop){
      if (rmsAt(o) < gate) continue;
      const r = yinF0(y, fs, o, W, minLag, maxLag, d); if (r) sg.f.push(69 + 12 * Math.log2(r.f0 / 440));
    }
    if (si % 6 === 5){ onProg && onProg(si / segs.length); await new Promise(z => setTimeout(z, 0)); }
  }
  const med = a => { const s = [...a].sort((p, q) => p - q); return s[s.length >> 1]; };
  for (const sg of segs){ const f = sg.f.filter((v, i, a) => i === 0 || Math.abs(v - a[i - 1]) < 7); sg.med = f.length >= 4 ? med(f) : null; sg.fr = f; }
  const meds = segs.filter(s => s.med != null).map(s => s.med).sort((a, b) => a - b);
  if (meds.length < 2) throw new Error('No encontré suficiente voz para separar las partes');
  let cm = meds[Math.floor(meds.length * 0.2)], cf = meds[Math.floor(meds.length * 0.8)];
  for (let it = 0; it < 20; it++){ const th = (cm + cf) / 2, A = meds.filter(v => v < th), B = meds.filter(v => v >= th); if (!A.length || !B.length) break;
    cm = A.reduce((p, q) => p + q, 0) / A.length; cf = B.reduce((p, q) => p + q, 0) / B.length; }
  const th = (cm + cf) / 2, gap = cf - cm;
  const out = segs.map(sg => {
    if (sg.med == null) return {t0: sg.t0, t1: sg.t1, w: null};
    const lo = sg.fr.filter(v => v < th).length / sg.fr.length;
    const w = sg.fr.length >= 10 && lo > 0.3 && lo < 0.7 ? 'b' : (lo >= 0.5 ? 'm' : 'f');
    return {t0: +sg.t0.toFixed(2), t1: +sg.t1.toFixed(2), w};
  });
  return {segs: out, gap: +gap.toFixed(1), single: gap < 3.5};
}
function voiceAt(song, t){ const v = song && song.voices; if (!v) return null; for (const s of v.segs) if (t >= s.t0 && t < s.t1) return s.w; return null; }
function duetFactor(song, t){ if (!song || !song.duet || !song.voices) return 1; const w = voiceAt(song, t); return w === song.duet ? 0 : w === 'b' ? 0.5 : 1; }
async function setDuet(deck, mode){
  const s = deck.song; if (!s) return;
  if (mode && !s.voices){
    deck.setStatus('Separando voces de él y de ella… 0%');
    try { s.voices = await detectVoices(s, p => deck.setStatus('Separando voces de él y de ella… ' + Math.round(p * 100) + '%')); }
    catch(e){ deck.setStatus(''); toast(e.message, 4500); deck.renderVox(); return; }
    deck.setStatus('');
    if (s.voices.single) toast('Parece que esta canción tiene una sola voz; revisa las marcas ♂/♀ en la letra.', 5000);
  }
  s.duet = mode || null; await saveSong(s);
  deck.applyVoice(); if (deck.isCur) markVoices();

}
function markVoices(){
  const s = curSong(); const el = $('#lyrics');
  $$('.vtag', el).forEach(x => x.remove());
  if (!s || !s.duet || !s.voices) return;
  for (const {t, el: ln} of S.timed){
    const w = voiceAt(s, t + 0.01); if (!w) continue;
    const tag = document.createElement('button'); tag.className = 'vtag v' + w; tag.dataset.t = t;
    tag.textContent = w === 'm' ? '♂' : w === 'f' ? '♀' : '⚭';
    tag.title = (w === s.duet ? 'La cantas tú' : w === 'b' ? 'Cantan los dos (su voz queda a medio volumen)' : 'La canta la grabación') + ' · clic para cambiar (él → ella → ambos)';
    if (w === s.duet) ln.classList.add('mine'); else ln.classList.remove('mine');
    ln.prepend(tag);
  }
}
document.addEventListener('click', async e => {

  async reauth(){ await this.interactive(); this.setState('idle'); this.syncSoon(50); },   // from a click

  /* ---- Drive REST ---- */
  async d(path, opts={}){

  async dj(path, opts){ const r = await this.d(path, opts); if (!r.ok) throw await this.err(r); return r.status === 204 ? null : r.json(); },
  async err(r){ let msg = 'Error ' + r.status; try { const j = await r.json(); if (j.error) msg += ': ' + (j.error.message || j.error.status); } catch(e){} return Object.assign(new Error(msg), {status: r.status}); },
  async list(q, fields='files(id,name,version,modifiedTime,createdTime)'){
    const out = []; let pt = '';

      const j = await this.dj('/drive/v3/files?spaces=appDataFolder&pageSize=1000&orderBy=createdTime&fields=nextPageToken,' + encodeURIComponent(fields) + (q ? '&q=' + encodeURIComponent(q) : '') + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''));

  },
  xput(url, blob, type, onProg){   // PUT with upload progress (fetch can't report it)

  async create(name, blob, type, onProg){   // new file in the hidden app folder; returns {id, version}

    const r = await this.d('/upload/drive/v3/files?uploadType=resumable&fields=id,version', {method:'POST',

  async getLibrary(){

  async putLibrary(lib, item){
    const body = new Blob([JSON.stringify(lib)], {type: 'application/json'});

    if (item) res = await this.dj('/upload/drive/v3/files/' + item.id + '?uploadType=media&fields=id,version', {method:'PATCH', headers: {'Content-Type': 'application/json'}, body});

  async uploadAsset(id, blob, onProg){ const r = await this.create(id, blob, blob.type || 'application/octet-stream', onProg); return r.id; },
  async downloadAsset(id){

  fetchAsset(id){   // on demand, de-duplicated

  async gcRemote(lib){

  /* ---- local change tracking (hooked into DB) ---- */
  referencedAssets(songs = [...S.songs.values()], pads = PADS){
    const ids = new Set();

  _last: {},
  kvStr(k, v){ if (k !== 'settings') return JSON.stringify(v); const p = {}; for (const x of this.SYNC_SETTINGS) p[x] = v[x]; return JSON.stringify(p); },
  kvChanged(k, v){ const s = this.kvStr(k, v); if (this._last[k] === s) return false; this._last[k] = s; return true; },
  hook(){
    const put = DB.put.bind(DB), del = DB.del.bind(DB), get = DB.get.bind(DB);
    DB.put = (store, val) => {
      if (!this.muted && this.m.enabled){
        if (store === 'songs'){ val.updatedAt = Date.now(); this.dirty(); }
        else if (store === 'assets'){ if (!this.m.idx[val.id] && !this.m.up.includes(val.id)) this.m.up.push(val.id); this.dirty(); }

      if (!this.m.idx[key]){ toast('Este audio todavía se está subiendo desde el otro equipo. Prueba en unos minutos.', 4000); return r; }
      try { toast('Descargando audio de Google Drive…', 1800); return await this.fetchAsset(key) || undefined; }

  dirty(){ this.m.dirty = true; this.saveMeta(); this.syncSoon(4000); },
  syncSoon(ms=4000){ if (!this.m.enabled) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), ms); },
  blocked(){ return DECKS.some(d => d.playing) || S.fading || (typeof CE !== 'undefined' && CE.on); },

  /* ---- merge ---- */
  localLib(){
    const songs = {}; for (const [id, s] of [...S.songs].sort((a, b) => a[0] < b[0] ? -1 : 1)) songs[id] = s;
    const pick = {}; for (const k of this.SYNC_SETTINGS) pick[k] = S.settings[k];

      settings:{at: this.m.at.settings || 0, v: pick}, assets: this.m.idx,

  merge(L, R){

  async applyLocal(M, L){

      const changed = new Set(), removed = [];
      for (const [id, s] of Object.entries(M.songs)) if (L.songs[id] !== s){ S.songs.set(id, s); await DB.put('songs', s); changed.add(id); }
      for (const id of Object.keys(L.songs)) if (!M.songs[id]){

      if (M.settings !== L.settings){ Object.assign(S.settings, M.settings.v || {}); this.m.at.settings = M.settings.at; await DB.kvSet('settings', S.settings); applyTheme(); applyColors(); $('#fadeSec').value = S.settings.fadeSec; $('#fadeSecVal').textContent = S.settings.fadeSec + 's'; $('#autoFade').checked = S.settings.autoFade; $('#vampOn').checked = !!S.settings.vamp; }
      if (M.playlists !== L.playlists){ S.playlists = M.playlists.v; await DB.kvSet('playlists', S.playlists); }
      if (M.plActive !== L.plActive){ S.plActive = M.plActive.v; this.m.at.plActive = M.plActive.at; await DB.kvSet('plActive', S.plActive); }

      else {
        const same = (a, b) => JSON.stringify([a.track, a.stems, a.transpose || 0]) === JSON.stringify([b.track, b.stems, b.transpose || 0]);

          if (!d.song || !changed.has(d.song.id)) continue;

      }

  },

  /* ---- the sync loop ---- */
  // pull, merge, push the library. Drive has no conditional writes; if two devices write at once,
  // each keeps its own changes locally and re-sends them on the next round.
  async libRound(){
    const {item, data, same} = await this.getLibrary();
    if (same && !this.m.dirty) return;
    if (data) this.setState('syncing', 'Biblioteca');
    const L = this.localLib();
    if (data){ const M = this.merge(L, data); await this.applyLocal(M, L); }
    if (this._join){ const add = this._join.filter(id => S.songs.has(id) && !S.setlist.includes(id)); this._join = null;
      if (add.length){ S.setlist.push(...add); saveSetlist(); renderSetlist(); } }
    const out = this.localLib();
    if (!same && data && !(this._dups && this._dups.length) && JSON.stringify(out) === JSON.stringify(data)) this.m.ver = item.version;
    else { this.m.ver = await this.putLibrary(out, item); this.m.remote = {songs: Object.keys(out.songs).length, audio: Object.keys(out.assets).length, copies: 1}; }

  async sync({force=false} = {}){
    if (!this.m.enabled) return;
    if (this.busy){ this.again = true; return; }
    if (!force && this.blocked()){ this.setState('wait'); this.syncSoon(5000); return; }

      // 1) songs, setlist and pads first, so the other devices see them right away
      await this.libRound();
      // 2) then the audio, one file at a time; the library is updated after each one so the other devices can fetch it
      const up = [...this.m.up]; let k = 0, mb = 0;
      const total = up.length;
      for (const id of up){
        k++;
        if (this.m.idx[id]){ this.m.up = this.m.up.filter(x => x !== id); continue; }
        const rec = await DB.get('assets', id);
        if (rec && rec.blob && rec.blob.size){
          const size = (rec.blob.size / 1e6).toFixed(0);
          this.setState('syncing', `Subiendo audio ${k} de ${total} (${size} MB)`);
          let lastP = -1;
          const gid = await this.uploadAsset(id, rec.blob, p => { const pc = Math.floor(p * 100); if (pc !== lastP){ lastP = pc; this.setState('syncing', `Subiendo audio ${k} de ${total} (${size} MB) · ${pc}%`); } });
          this.m.idx[id] = {name: rec.name || id, type: rec.type || rec.blob.type || '', size: rec.blob.size, gid};

        }

      }
      if (this.m.dirty && !this.blocked()) await this.libRound();

      this.m.last = Date.now(); await this.saveMeta();

    } catch(e){
      if (!e.auth) console.warn('Sync', e);
      if (e.auth) this.setState('auth', e.message);
      else if (e.offline) { this.setState('offline'); }

      this.busy = false;

  },
  // keep the setlist (and pads) playable offline: fetch their audio in the background
  async prefetch(all=false){
    if (this.dl) return this.dl;
    this.dl = (async () => {
      const songs = all ? [...S.songs.values()] : S.setlist.map(id => S.songs.get(id)).filter(Boolean);
      const ids = this.referencedAssets(songs, PADS).filter(id => this.m.idx[id]);
      let n = 0, done = 0;
      for (const id of ids){
        if (this.blocked() && !all) break;
        const have = await DB.req('assets', 'readonly', (s, m) => s ? s.getKey(id) : (m.has(id) ? id : undefined));
        if (have) continue;
        n++; this.setState('syncing', `Descargando audio ${n}`);
        try { await this.fetchAsset(id); done++; } catch(e){ console.warn('Descarga', id, e); }
      }
      if (n) this.setState('idle', done < n ? `Faltan ${n - done} audios` : '');
      return {n, done};
    })().finally(() => { this.dl = null; });
    return this.dl;
  },
  async init(){   // call after boot has loaded settings, setlist and pads
    await this.loadMeta(); this.hook();
    this.kvChanged('setlist', S.setlist); this.kvChanged('pads', PADS); this.kvChanged('settings', S.settings); this.kvChanged('playlists', S.playlists); this.kvChanged('plActive', S.plActive);
    this.renderChip();
    if (!this.m.enabled) return;
    this.setState('idle');
    this.prepare().catch(e => console.warn(e));
    window.addEventListener('online', () => this.syncSoon(500));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.syncSoon(800); });
    this.syncSoon(1500);
  }
};

function settingsCloudHTML(){

      <span>Estado</span><div><b id="cState"></b><div class="muted" id="cDetail" style="font-size:12px"></div></div>
      <span>ID de cliente</span><input id="cId" placeholder="123456789-abc….apps.googleusercontent.com" spellcheck="false" style="font-family:ui-monospace,monospace;font-size:12px">
      <span class="hint">El "ID de cliente" que creaste en Google Cloud. Origen autorizado: <code id="cOrigin"></code></span>
      <span></span><div class="row" style="flex-wrap:wrap;gap:6px"><button class="primary" id="cConnect">Conectar con Google Drive</button><button id="cSync">Sincronizar ahora</button><button id="cAll">Descargar todo el audio</button><button class="ghost" id="cOff">Desconectar</button></div>
      <span class="hint">Se guarda todo (canciones, setlist, pads, colores y audio) en una carpeta oculta de tu Google Drive que solo esta app puede ver; la app no tiene acceso al resto de tus archivos. Las canciones del setlist se descargan solas para tocar sin internet; las demás, al abrirlas. Google pide confirmar la sesión cada hora: si ves 🔑 arriba, tócalo.</span>
    </div>`;
}
function wireCloudSettings(m){
  const q = x => $(x, m.el);
  q('#cOrigin').textContent = location.origin;
  q('#cId').value = CLOUD.clientId;
  const names = {off:'Desconectado', idle:'Sincronizado ✓', syncing:'Sincronizando…', wait:'En pausa mientras suena la música', error:'Error', auth:'Toca "Reconectar"', offline:'Sin conexión'};
  const upd = () => {
    if (!document.body.contains(m.el)) { CLOUD.onState = null; return; }
    const on = CLOUD.m.enabled;
    q('#cState').textContent = (names[CLOUD.state] || CLOUD.state) + (on && CLOUD.m.user ? ' · ' + CLOUD.m.user : '');
    const rm = CLOUD.m.remote;
    q('#cDetail').textContent = [CLOUD.detail, CLOUD.m.last ? 'última: ' + new Date(CLOUD.m.last).toLocaleTimeString() : '',
      on ? `En este equipo: ${S.songs.size} canciones` + (rm ? ` · En Drive: ${rm.songs} canciones, ${rm.audio} audios` : '') + (CLOUD.m.up.length ? ` · ${CLOUD.m.up.length} audios por subir` : '') : ''].filter(Boolean).join(' · ');
    q('#cConnect').classList.toggle('hidden', on && CLOUD.state !== 'auth');
    q('#cConnect').textContent = on ? 'Reconectar' : 'Conectar con Google Drive';
    for (const b of ['#cSync', '#cAll', '#cOff']) q(b).classList.toggle('hidden', !on);
    q('#cId').disabled = on && CLOUD.state !== 'auth';
  };
  CLOUD.onState = upd; upd();
  const prep = () => { if (CLOUD.clientId) CLOUD.prepare().catch(e => toast(e.message, 4000)); };
  q('#cId').onchange = async e => { CLOUD.m.clientId = e.target.value.trim(); CLOUD.tc = null; await CLOUD.saveMeta(); prep(); };
  prep();   // preload so the Google window opens straight from the click
  q('#cConnect').onclick = async () => {
    if (!CLOUD.clientId && !window.__CLOUD_MOCK){ toast('Pega primero el ID de cliente.'); q('#cId').focus(); return; }
    try { if (CLOUD.m.enabled) await CLOUD.reauth(); else await CLOUD.connect(); upd(); toast('Google Drive conectado. Sincronizando…'); }
    catch(e){ console.warn(e); toast('No se pudo conectar: ' + e.message, 5000); }
  };
  q('#cSync').onclick = () => { if (CLOUD.state === 'auth') return q('#cConnect').click(); if (CLOUD.busy){ toast('Ya está sincronizando' + (CLOUD.detail ? ': ' + CLOUD.detail : '…')); return; } CLOUD.sync({force:true}); };
  q('#cAll').onclick = async () => { toast('Descargando todo el audio de la biblioteca…'); const r = await CLOUD.prefetch(true); toast(r && r.n ? `Descargados ${r.done} de ${r.n} audios.` : 'Ya tienes todo el audio en este equipo.'); };
  q('#cOff').onclick = async () => { if (await confirmBox('¿Desconectar Google Drive en este equipo? Tus canciones se quedan aquí y en Drive; solo deja de sincronizar.', 'Desconectar')){ await CLOUD.disconnect(); upd(); } };
}

$('#btnLib').onclick = openLibrary; $('#btnAddSet').onclick = openLibrary;

$('#btnCloud').onclick = () => { if (CLOUD.state === 'auth' && CLOUD.ready()) CLOUD.reauth().catch(e => { toast('No se pudo conectar: ' + e.message, 5000); }); else openSettings({cloud:true}); };
$('#btnTheme').onclick = () => { const cur = document.documentElement.dataset.theme; S.settings.theme = cur === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); };
$('#tUp').onclick = () => changeTranspose(1); $('#tDown').onclick = () => changeTranspose(-1); $('#tReset').onclick = () => changeTranspose(0);
$('#capo').innerHTML = Array.from({length:10}, (_, i) => `<option value="${i}">${i}</option>`).join('');
$('#capo').onchange = async e => { const s = curSong(); if (!s) return; s.capo = +e.target.value; await saveSong(s); renderLyrics(true); };
$('#fUp').onclick = () => { S.settings.fontSize = clamp(S.settings.fontSize + 2, 14, 56); applyFont(); saveSettings(); };
$('#fDown').onclick = () => { S.settings.fontSize = clamp(S.settings.fontSize - 2, 14, 56); applyFont(); saveSettings(); };
$('#scrollMode').onclick = () => { S.scrollMode = S.scrollMode === 'auto' ? 'manual' : 'auto'; $('#scrollMode').textContent = 'Scroll: ' + (S.scrollMode === 'auto' ? 'Auto' : 'Manual'); };
$('#spUp').onclick = () => setSpeed(S.speed + 0.1); $('#spDown').onclick = () => setSpeed(S.speed - 0.1);
function setSpeed(v){ const d = DECK_CUR(); const t = d.time; S.speed = clamp(Math.round(v*10)/10, 0.3, 3); if (d.kind === 'none' && d.playing){ d.offset = t; d.clockStart = performance.now(); } $('#spVal').textContent = S.speed.toFixed(1) + '×'; }
$('#markStart').onclick = async () => { const s = curSong(), d = DECK_CUR(); if (!s) return; s.scrollStart = Math.round(d.time*10)/10; if (s.scrollEnd != null && s.scrollEnd <= s.scrollStart) s.scrollEnd = null; await saveSong(s); S.userOffset = 0; renderMarks(d); toast('Inicio de letra marcado en ' + fmtT(s.scrollStart)); };
$('#markEnd').onclick = async () => { const s = curSong(), d = DECK_CUR(); if (!s) return; const t = Math.round(d.time*10)/10; if (s.scrollStart != null && t <= s.scrollStart){ toast('El fin debe ser después del inicio.'); return; } s.scrollEnd = t; await saveSong(s); S.userOffset = 0; renderMarks(d); toast('Fin de letra marcado en ' + fmtT(t)); };

function isTyping(t){
  if (!t || !t.closest) return false;
  if (t.closest('textarea,[contenteditable]')) return true;
  if (t.tagName === 'SELECT') return true;
  return t.tagName === 'INPUT' && /^(text|url|number|search|email|password|)$/i.test(t.type || '');
}
// after using a dropdown/slider/checkbox, give the keyboard (and pedals) back to the app
document.addEventListener('change', e => { if (e.target.matches && e.target.matches('select,input[type=range],input[type=checkbox],input[type=radio],input[type=color]') && !e.target.closest('.overlay,.pop')) e.target.blur(); });
document.addEventListener('pointerup', e => { if (e.target.matches && e.target.matches('input[type=range],input[type=checkbox]') && !e.target.closest('.overlay,.pop')) setTimeout(() => e.target.blur(), 0); });
// clicking the YouTube player moves keyboard focus into its iframe; take it back
window.addEventListener('blur', () => setTimeout(() => { const a = document.activeElement; if (a && a.tagName === 'IFRAME'){ a.blur(); window.focus(); } }, 400));
document.addEventListener('keydown', e => {
  if (CE.on && !isTyping(e.target) && !CE.pop){
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); ceUndo(); return; }
    if (e.key === 'Escape'){ if (CE.pop) cePopClose(); else if (CE.tap) ceTapToggle(); else exitChordEdit(); return; }
    if (CE.tap && !e.metaKey && !e.ctrlKey){
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); ceTapHit(); return; }
      if (e.key === 'ArrowUp' || e.key === 'PageUp'){ e.preventDefault(); ceTapStep(-1); return; }
    }
  }
  if (isTyping(e.target) || document.querySelector('.overlay') || CE.pop || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target !== document.body && e.target.blur) e.target.blur();   // sliders/checkboxes/buttons must not swallow stage shortcuts
  const k = e.key, el = $('#lyrics');
  if (k === ' '){ e.preventDefault(); const d = DECK_CUR(); if (d.song) d.toggle(); }
  else if (k === 't' || k === 'T' || k === 'ArrowRight'){ e.preventDefault(); transition(); }
  else if (k === 'ArrowDown' || k === 'PageDown'){ e.preventDefault(); S.nudge += el.clientHeight * (k === 'PageDown' ? 0.6 : 0.25); }
  else if (k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); S.nudge -= el.clientHeight * (k === 'PageUp' ? 0.6 : 0.25); }
  else if (k === '+' || k === '='){ changeTranspose(1); }
  else if (k === '-' || k === '_'){ changeTranspose(-1); }
  else if (/^Digit[1-4]$/.test(e.code)){ e.preventDefault(); const i = +e.code.slice(5) - 1; if (e.shiftKey) trackMute(i); else trackPress(i); }
  else if (k === 'Escape'){ stopAllPads(); stopAllLoops(); }
  else if (k === 'v' || k === 'V'){ const d = DECK_CUR(); if (d.hasStems) d.toggleVoice(); else toast('Esta canción no tiene la voz separada. Analízala desde ✎ Editar.'); }
  else if (k === 'c' || k === 'C'){ const d = DECK_CUR(); if (d.hasBacking) d.toggleBacking(); else toast(d.hasStems ? 'Separa los coros desde ✎ Editar.' : 'Esta canción no tiene la voz separada. Analízala desde ✎ Editar.'); }
  else { const i = PAD_KEYS.indexOf(k.toLowerCase()); if (i >= 0 && !e.repeat) padDown(i); }
});
document.addEventListener('keyup', e => { const i = PAD_KEYS.indexOf((e.key||'').toLowerCase()); if (i >= 0) padUp(i); });
document.addEventListener('mouseup', e => { const b = e.target.closest('button'); if (b) setTimeout(() => b.blur(), 0); });
document.addEventListener('keyup', e => { if (e.key === ' ' && !e.target.closest('input,textarea,select')) e.preventDefault(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ================= Boot ================= */
(async function boot(){
  await DB.open();
  const st = await DB.kvGet('settings', null); if (st) Object.assign(S.settings, st);
  applyTheme(); applyFont(); applyFooter(); applyColors();
  $('#fadeSec').value = S.settings.fadeSec; $('#fadeSecVal').textContent = S.settings.fadeSec + 's'; $('#autoFade').checked = S.settings.autoFade; $('#vampOn').checked = !!S.settings.vamp;
  for (const s of await DB.all('songs')) S.songs.set(s.id, s);
  S.setlist = (await DB.kvGet('setlist', [])).filter(id => S.songs.has(id));
  const pads = await DB.kvGet('pads', null); if (pads) PADS = pads.map(p => ({assetId:null, name:'', mode:'oneshot', vol:0.9, ...p}));
  S.playlists = await DB.kvGet('playlists', []); S.plActive = await DB.kvGet('plActive', null);
  await CLOUD.init();
  renderPlaylists();
  LOOP.tracks = Array.from({length:4}, (_, i) => ({idx:i, data:null, undo:null, state:'empty', src:null, g:null, vol:0.9}));
  DECKS = [new Deck(0), new Deck(1)];
  renderPads(); renderTracks();
  if (location.protocol === 'file:'){
    const b = document.createElement('div'); b.className = 'banner';
    b.textContent = 'Estás abriendo Escenario como archivo local: YouTube y el micrófono no funcionarán. Ábrelo desde un servidor (GitHub Pages, o "python3 -m http.server" en esta carpeta → http://localhost:8000).';
    document.body.insertBefore(b, document.body.firstChild); document.body.style.gridTemplateRows = 'auto 56px minmax(0,1fr) auto';
    $('header').style.gridRow = '2'; $('main').style.gridRow = '3'; $('aside').style.gridRow = '3'; $('#footer').style.gridRow = '4';
  }
  const cur = await DB.kvGet('curId', null);
  const first = cur && S.songs.has(cur) ? cur : (S.setlist[0] || null);
  if (first) await setCurrent(first); else { renderLyrics(); renderSetlist(); DECKS.forEach(d => d.render()); }
  // AudioContext needs a gesture; create lazily on first interaction
  document.addEventListener('pointerdown', () => audio(), {once:true});
  requestAnimationFrame(scrollTick);
  window.__booted = true;
})();
