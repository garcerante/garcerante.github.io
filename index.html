<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escenario</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23b45309%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1c1c1e; --muted:#6c6c72; --border:#e2dfd8;
  --accent:#b45309; --accent-soft:#fdf0e1; --ok:#15803d; --rec:#dc2626; --dub:#d97706; --info:#2563eb;
  --guide:rgba(180,83,9,.05); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --radius:10px; --lyric-size:24px; --chord:var(--accent); --lyric:var(--text);
}
[data-theme="dark"]{
  --bg:#111113; --surface:#1a1a1d; --surface2:#232327; --text:#ededed; --muted:#9b9ba3; --border:#2d2d33;
  --accent:#f2a93b; --accent-soft:#2b2214; --ok:#22c55e; --rec:#ef4444; --dub:#f59e0b; --info:#60a5fa;
  --guide:rgba(242,169,59,.06); --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:grid;grid-template-rows:56px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 360px;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;line-height:1.2}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] button.primary{color:#1a1205}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--surface2)}
button.icon{padding:6px 8px;min-width:32px}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
input[type=range]{accent-color:var(--accent)}
kbd{font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:4px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--accent-soft);color:var(--accent)}

/* Top bar */
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.songhead{min-width:0;flex:1;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.songhead b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songhead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
.group button{border:none;background:transparent;padding:4px 8px}
.group button:hover{background:var(--surface)}
.keyval{min-width:84px;text-align:center;font-weight:600}
.keyval small{font-weight:400;color:var(--muted)}

/* Lyrics */
main{grid-row:2;grid-column:1;position:relative;display:flex;flex-direction:column;min-height:0}
#lyricsWrap{flex:1;min-height:0;position:relative}
#lyrics{position:absolute;inset:0;overflow-y:auto;padding:28px 40px 0;scrollbar-width:thin}
#lyrics::after{content:"";display:block;height:70vh}
#guide{position:absolute;left:0;right:0;top:35%;height:calc(var(--lyric-size)*2.6);transform:translateY(-30%);background:var(--guide);pointer-events:none;border-top:1px dashed transparent}
.song{font-size:var(--lyric-size);max-width:1100px;color:var(--lyric)}
.ln{margin:0 0 .15em;white-space:normal}
.seg{display:inline-block;vertical-align:bottom;white-space:pre}
.seg .ch{display:block;color:var(--chord);font-weight:700;font-size:.82em;line-height:1.15;min-height:1.15em;padding-right:.45em}
.seg .tx{display:block;line-height:1.3;min-height:1.3em}
.seg .ch.nc{color:var(--muted);font-weight:500}
.ln.chords .seg .ch{padding-right:1.1em}
.ln.chords .seg .tx{display:none}
.ln.lyric{line-height:1.3;white-space:pre-wrap}
.ln.blank{height:.8em}
.ln.section{display:inline-block;margin:.7em 0 .35em;font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.ln.tab{font:0.62em/1.35 ui-monospace,Menlo,monospace;white-space:pre;color:var(--muted)}
.empty{max-width:560px;margin:8vh auto;text-align:center;font-size:15px}
.empty h2{font-size:22px;margin:0 0 8px}
.empty .row{justify-content:center;margin-top:16px}
.lyricsbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface);font-size:13px;flex-wrap:wrap}
.lyricsbar .group button{font-size:13px}
.ln[data-t]{border-left:3px solid transparent;margin-left:-14px;padding-left:11px;border-radius:2px;transition:border-color .2s}
.ln.now{border-left-color:var(--chord)}
.vox{display:flex;align-items:center;gap:6px;font-size:12px}
.vox button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.vox button{white-space:nowrap;padding:4px 8px}
.vox button.off{color:var(--muted);border-style:dashed}
.vox .vlab{white-space:nowrap;min-width:52px;text-align:right}
#jobs{position:fixed;right:376px;top:68px;max-height:calc(100vh - 330px);overflow-y:auto;z-index:45;display:flex;flex-direction:column;gap:8px;width:340px}
.job{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.job b{font-size:13px}
.job .steps{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px}
.job .steps .act{color:var(--text);font-weight:600}
.job .steps .done{color:var(--ok)}
.job .steps .err{color:var(--rec)}
.jbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.jbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.aibox{border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.aibox .row{flex-wrap:wrap}

/* Right column */
aside{grid-row:2;grid-column:2;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.decks{display:flex;flex-direction:column;gap:10px;padding:12px}
.deck{border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.deck.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.deck .role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.deck.cur .role{color:var(--accent)}
.deck .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .bar{height:8px;border-radius:4px;background:var(--surface2);cursor:pointer;position:relative;overflow:hidden}
.deck .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.deck .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.6}
.deck .time{font:12px ui-monospace,Menlo,monospace;color:var(--muted);min-width:92px;text-align:right}
.deck .yt{width:100%;height:200px;border-radius:8px;overflow:hidden;background:#000}
.deck .yt iframe{width:100%;height:100%;border:0}
.deck .vol{width:80px}
.play{min-width:44px;font-size:16px}
.fade{order:1;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--border);border-radius:var(--radius)}
.fade button.primary{font-weight:600;padding:9px}
.fadeprog{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.fadeprog i{display:block;height:100%;width:0;background:var(--accent)}
.sect{padding:4px 12px 12px}
.sect h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0;display:flex;align-items:center;gap:6px}
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.setlist li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.setlist li:hover{background:var(--surface2)}
.setlist li.cur{border-color:var(--accent);background:var(--accent-soft)}
.setlist li.next{border-color:var(--border);border-style:dashed}
.setlist .n{width:18px;color:var(--muted);font-size:12px;text-align:right}
.setlist .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setlist .acts{display:none;gap:2px}
.setlist li:hover .acts{display:flex}
.setlist .acts button{padding:2px 6px;font-size:12px}
.tag{font-size:11px;color:var(--muted)}

/* Bottom: looper + pads */
footer{grid-column:1/3;grid-row:3;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:14px;padding:10px 14px;min-height:0}
footer.collapsed .fbody{display:none}
.fcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.fhead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fhead .chip{text-transform:none;letter-spacing:0;font-weight:500}
.looper{flex:1.35}
.pads{flex:1}
.fbody{display:flex;gap:10px;min-height:0}
.micbox{display:flex;flex-direction:column;gap:6px;width:200px;font-size:12px}
.micbox select{width:100%;font-size:12px;padding:4px}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s}
.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.trk{border:1px solid var(--border);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--bg)}
.trk .big{height:58px;border-radius:10px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--border);background:var(--surface)}
.trk .big small{font-weight:500;color:var(--muted)}
.trk[data-state="rec"] .big,.trk[data-state="dub"] .big{border-color:var(--rec);color:var(--rec);animation:pulse 1s infinite}
.trk[data-state="dub"] .big{border-color:var(--dub);color:var(--dub)}
.trk[data-state="play"] .big{border-color:var(--ok);color:var(--ok)}
.trk[data-state="mute"] .big{color:var(--muted);border-style:dashed}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(220,38,38,.15)}}
.trk .phase{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.trk .phase i{display:block;height:100%;width:0;background:var(--muted)}
.trk .mini{display:flex;gap:4px;align-items:center}
.trk .mini button{padding:2px 6px;font-size:12px}
.trk .mini input{width:100%;min-width:0}
.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}
.pad{position:relative;height:62px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:4px 6px;text-align:center;user-select:none;touch-action:none}
.pad .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad .md{font-size:10px;color:var(--muted)}
.pad.emptyp{border-style:dashed;color:var(--muted)}
.pad.on{border-color:var(--accent);background:var(--accent-soft)}
.pad .cfg{position:absolute;top:2px;right:2px;padding:0 5px;font-size:11px;border:none;background:transparent;color:var(--muted)}
.pad kbd{position:absolute;bottom:3px;left:4px;margin:0}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(1100px,94vw);max-height:92vh;display:flex;flex-direction:column}
.modal header,.modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);grid-column:auto;background:transparent;height:auto}
.modal h2{margin:0;font-size:17px;flex:1}
.mbody{padding:16px 18px;overflow:auto;display:flex;gap:16px;min-height:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.form{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label > *{color:var(--text);font-size:14px}
.form .row > label{min-width:0}
.form .row > label input{width:100%;min-width:0}
.form textarea{min-height:300px;font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical;white-space:pre;overflow:auto}
.preview{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;max-height:66vh;background:var(--bg)}
.preview .song{font-size:16px}
.radio{display:flex;gap:6px}
.radio label{flex-direction:row;align-items:center;gap:4px;color:var(--text);font-size:13px;border:1px solid var(--border);padding:5px 9px;border-radius:8px;cursor:pointer}
.radio input{margin:0}
.lib{flex-direction:column}
.liblist{display:flex;flex-direction:column;gap:4px}
.libitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px}
.libitem .t{flex:1;min-width:0}
.libitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;align-items:center;font-size:14px}
.settings .hint{grid-column:2;font-size:12px;color:var(--muted);margin-top:-6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.keys kbd{margin:0}
#toast{position:fixed;left:50%;bottom:220px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.show{opacity:.95}
.banner{grid-column:1/3;background:var(--accent-soft);color:var(--accent);font-size:13px;padding:6px 14px}
.pop{position:fixed;z-index:55;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:8px;width:240px;font-size:13px}
@media (max-width:1100px){ body{grid-template-columns:minmax(0,1fr) 320px} .micbox{width:160px} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Escenario</div>
  <button class="ghost" id="btnLib" title="Biblioteca y setlist">☰ Biblioteca</button>
  <div class="songhead"><b id="hTitle">Sin canción</b><span class="muted" id="hArtist"></span></div>
  <div class="group" title="Transponer (acordes y pista de audio)">
    <button id="tDown" title="Bajar medio tono (−)">−</button>
    <div class="keyval" id="keyVal">—</div>
    <button id="tUp" title="Subir medio tono (+)">+</button>
    <button id="tReset" title="Volver al tono original">↺</button>
  </div>
  <div class="group" title="Cejilla: muestra las formas de acordes con cejilla (no cambia el sonido)">
    <span class="muted" style="font-size:12px;padding-left:6px">Cejilla</span>
    <select id="capo" style="border:none;background:transparent;padding:3px"></select>
  </div>
  <div class="group">
    <button id="fDown" title="Letra más pequeña">A−</button>
    <button id="fUp" title="Letra más grande">A+</button>
  </div>
  <button class="ghost icon" id="btnTheme" title="Modo claro/oscuro" style="font-size:16px">☾</button>
  <button class="ghost icon" id="btnSettings" title="Ajustes y atajos">⚙</button>
</header>

<main>
  <div id="lyricsWrap">
    <div id="guide"></div>
    <div id="lyrics"></div>
  </div>
  <div class="lyricsbar">
    <div class="group">
      <button id="scrollMode" title="Scroll automático sincronizado con la pista, o manual (pedal/rueda)">Scroll: Auto</button>
    </div>
    <span class="chip" id="scrollInfo">—</span>
    <div class="group" id="speedGroup" title="Velocidad del scroll (solo canciones sin pista)">
      <button id="spDown">🐢</button><span id="spVal" style="min-width:40px;text-align:center">1.0×</span><button id="spUp">🐇</button>
    </div>
    <span class="grow"></span>
    <span class="muted">Sincronía:</span>
    <button id="markStart" title="Marca el momento en que empieza la letra (con la pista sonando)">Marcar inicio</button>
    <button id="markEnd" title="Marca el momento en que termina la letra">Marcar fin</button>
    <button id="markReset" class="ghost" title="Borrar marcas de sincronía">↺</button>
    <button id="btnEdit" title="Editar canción">✎ Editar</button>
  </div>
</main>

<aside>
  <div class="decks" id="decks">
    <div class="deck" id="deck0"></div>
    <div class="fade" id="fadeBox">
      <button class="primary" id="btnFade">Transicionar ⇢ <kbd style="color:inherit;border-color:currentColor">T</kbd></button>
      <div class="fadeprog"><i id="fadeProg"></i></div>
      <div class="row" style="font-size:12px">
        <span class="muted">Fundido</span>
        <input type="range" id="fadeSec" min="1" max="20" step="1" class="grow">
        <span id="fadeSecVal" style="width:28px">6s</span>
        <label class="row" title="Empieza el fundido automáticamente antes de que termine la pista"><input type="checkbox" id="autoFade"> Auto</label>
      </div>
    </div>
    <div class="deck" id="deck1"></div>
  </div>
  <div class="sect">
    <h3>Setlist <span class="grow"></span><button class="ghost" id="btnAddSet" style="font-size:12px;text-transform:none;letter-spacing:0">+ Añadir</button></h3>
    <ul class="setlist" id="setlist"></ul>
  </div>
</aside>

<footer id="footer">
  <div class="fcol looper">
    <div class="fhead">Looper <span class="chip" id="loopInfo">Sin loop</span><span class="grow"></span>
      <button class="ghost" id="btnLoopReset" style="font-size:12px;text-transform:none;letter-spacing:0">Borrar todo</button>
      <button class="ghost" id="btnCollapse" style="font-size:12px;text-transform:none;letter-spacing:0" title="Ocultar/mostrar looper y pads">▾</button>
    </div>
    <div class="fbody">
      <div class="micbox">
        <button id="btnMic">🎤 Activar micrófono</button>
        <select id="micDev" class="hidden" title="Entrada de audio"></select>
        <select id="micCh" class="hidden" title="Canal de entrada">
          <option value="mix">Mezcla (1+2)</option><option value="1">Canal 1</option><option value="2">Canal 2</option>
        </select>
        <div class="meter" title="Nivel de entrada"><i id="meter"></i></div>
        <label class="row muted"><input type="checkbox" id="monitor"> Escucharme por la salida</label>
      </div>
      <div class="tracks" id="tracks"></div>
    </div>
  </div>
  <div class="fcol pads">
    <div class="fhead">Pads <span class="chip">Clic para cargar un sonido</span><span class="grow"></span>
      <button class="ghost" id="btnPadStop" style="font-size:12px;text-transform:none;letter-spacing:0">■ Detener <kbd>Esc</kbd></button></div>
    <div class="fbody"><div class="padgrid" id="pads"></div></div>
  </div>
</footer>

<div id="toast"></div>
<input type="file" id="filePad" accept="audio/*" class="hidden">

class FifoSampleBuffer {
  constructor() {
    this._vector = new Float32Array();

<script type="text/plain" id="pitchcore">// Worker core: shift pitch of stereo PCM keeping tempo
function shiftPitch(L, R, semis, onProgress){
  const st = new SoundTouch(); st.pitchSemitones = semis; st.tempo = 1;
  const n = L.length, pad = 16384;
  const src = { extract(target, numFrames, position){
      for (let i=0;i<numFrames;i++){ const p=i+position; target[2*i] = p<n?L[p]:0; target[2*i+1] = p<n?R[p]:0; }
      return Math.min(numFrames, Math.max(0, n + pad - position)); } };
  const f = new SimpleFilter(src, st);
  const oL = new Float32Array(n), oR = new Float32Array(n);
  const chunk = 8192, buf = new Float32Array(chunk*2); let out = 0, lastP = 0;
  while (out < n){
    const got = f.extract(buf, chunk); if (!got) break;
    const m = Math.min(got, n-out);
    for (let i=0;i<m;i++){ oL[out+i]=buf[2*i]; oR[out+i]=buf[2*i+1]; }
    out += m;
    if (onProgress && out - lastP > 441000){ lastP = out; onProgress(out/n); }
  }
  return [oL, oR];
}

<script type="text/plain" id="anlib">// ===== Audio analysis: chords (chroma + HMM), vocal phrases, song assembly =====

  const imag = new Float32Array(n / 2);
  for (let k = 0; k < n / 2; k++) {
    const angle = 2 * Math.PI * k / n;
    real[k] = Math.cos(angle);
    imag[k] = Math.sin(angle);

function bitReverse(n, bits) {

  for (let i = 0; i < bits; i++) {
    result = (result << 1) | (n & 1);
    n >>= 1;
  }
  return result;
}

function fft(realOut, imagOut, realIn, n) {
  const bits = Math.log2(n) | 0;
  const twiddles = getFFTTwiddles(n);

  for (let i = 0; i < n; i++) {
    const j = bitReverse(i, bits);
    realOut[i] = realIn[j];
    imagOut[i] = 0;
  }

  for (let size = 2; size <= n; size *= 2) {
    const halfSize = size / 2;
    const step = n / size;
    for (let i = 0; i < n; i += size) {
      for (let j = 0; j < halfSize; j++) {
        const k = j * step;
        const tReal = twiddles.real[k];
        const tImag = twiddles.imag[k];
        const idx1 = i + j;
        const idx2 = i + j + halfSize;
        const eReal = realOut[idx1];
        const eImag = imagOut[idx1];
        const oReal = realOut[idx2] * tReal - imagOut[idx2] * tImag;
        const oImag = realOut[idx2] * tImag + imagOut[idx2] * tReal;
        realOut[idx1] = eReal + oReal;
        imagOut[idx1] = eImag + oImag;
        realOut[idx2] = eReal - oReal;
        imagOut[idx2] = eImag - oImag;

function ifft(realOut, imagOut, realIn, imagIn, n) {

  const twiddles = getIFFTTwiddles(n);

  for (let i = 0; i < n; i++) {
    const j = bitReverse(i, bits);
    realOut[i] = realIn[j];
    imagOut[i] = imagIn[j];
  }

  for (let size = 2; size <= n; size *= 2) {
    const halfSize = size / 2;
    const step = n / size;
    for (let i = 0; i < n; i += size) {
      for (let j = 0; j < halfSize; j++) {

        const tImag = twiddles.imag[k];

        const idx2 = i + j + halfSize;
        const eReal = realOut[idx1];
        const eImag = imagOut[idx1];
        const oReal = realOut[idx2] * tReal - imagOut[idx2] * tImag;
        const oImag = realOut[idx2] * tImag + imagOut[idx2] * tReal;
        realOut[idx1] = eReal + oReal;
        imagOut[idx1] = eImag + oImag;
        realOut[idx2] = eReal - oReal;
        imagOut[idx2] = eImag - oImag;

function stft(signal, fftSize, hopSize) {

  const numBins = fftSize / 2 + 1;

  const specImag = new Float32Array(numFrames * numBins);

  const frameImag = new Float32Array(fftSize);
  const windowedFrame = new Float32Array(fftSize);

function istft(specReal, specImag, numFrames, numBins, fftSize, hopSize, length) {

  const outReal = new Float32Array(fftSize);
  const outImag = new Float32Array(fftSize);

  for (let frame = 0; frame < numFrames; frame++) {

    fullImag.fill(0);

    for (let k = 0; k < numBins; k++) {
      fullReal[k] = specReal[frame * numBins + k];
      fullImag[k] = specImag[frame * numBins + k];
    }

    for (let k = 1; k < numBins - 1; k++) {
      fullReal[fftSize - k] = fullReal[k];
      fullImag[fftSize - k] = -fullImag[k];
    }

    ifft(outReal, outImag, fullReal, fullImag, fftSize);

function reflectPad(signal, padLeft, padRight) {
  const length = signal.length;
  const output = new Float32Array(padLeft + length + padRight);

  for (let i = 0; i < padLeft; i++) {
    const srcIdx = Math.min(padLeft - i, length - 1);
    output[i] = signal[srcIdx];
  }

  output.set(signal, padLeft);

  for (let i = 0; i < padRight; i++) {
    const srcIdx = Math.max(0, length - 2 - i);
    output[padLeft + length + i] = signal[srcIdx];
  }

  return output;

 * Demucs audio processor - Core separation logic

const { SAMPLE_RATE, FFT_SIZE, HOP_SIZE, TRAINING_SAMPLES, MODEL_SPEC_BINS, MODEL_SPEC_FRAMES, SEGMENT_OVERLAP, TRACKS } = CONSTANTS;

/**
 * Convert model frequency output to complex spectrogram per track
 */
function standaloneMask(freqOutput) {
  const numTracks = 4;
  const numChannels = 4;
  const numBins = MODEL_SPEC_BINS;
  const numFrames = MODEL_SPEC_FRAMES;
  const result = [];

  for (let t = 0; t < numTracks; t++) {
    const trackSpec = {
      leftReal: new Float32Array(numBins * numFrames),
      leftImag: new Float32Array(numBins * numFrames),
      rightReal: new Float32Array(numBins * numFrames),
      rightImag: new Float32Array(numBins * numFrames)
    };

    for (let f = 0; f < numFrames; f++) {
      for (let b = 0; b < numBins; b++) {
        const baseIdx = t * numChannels * numBins * numFrames;
        const outIdx = b * numFrames + f;
        trackSpec.leftReal[outIdx] = freqOutput[baseIdx + 0 * numBins * numFrames + b * numFrames + f];
        trackSpec.leftImag[outIdx] = freqOutput[baseIdx + 1 * numBins * numFrames + b * numFrames + f];
        trackSpec.rightReal[outIdx] = freqOutput[baseIdx + 2 * numBins * numFrames + b * numFrames + f];
        trackSpec.rightImag[outIdx] = freqOutput[baseIdx + 3 * numBins * numFrames + b * numFrames + f];
      }
    }
    result.push(trackSpec);
  }

  return result;
}

/**
 * Convert complex spectrogram back to time domain (iSTFT with proper offsets)
 */
function standaloneIspec(trackSpec, targetLength) {
  const numBins = MODEL_SPEC_BINS;
  const numFrames = MODEL_SPEC_FRAMES;
  const hopLength = HOP_SIZE;
  const paddedBins = numBins + 1;
  const paddedFrames = numFrames + 4;

  const padChannel = (real, imag) => {
    const paddedReal = new Float32Array(paddedFrames * paddedBins);
    const paddedImag = new Float32Array(paddedFrames * paddedBins);

    for (let f = 0; f < numFrames; f++) {
      for (let b = 0; b < numBins; b++) {
        const srcIdx = b * numFrames + f;
        const dstFrame = f + 2;
        const dstIdx = dstFrame * paddedBins + b;
        paddedReal[dstIdx] = real[srcIdx];
        paddedImag[dstIdx] = imag[srcIdx];
      }
    }
    return { real: paddedReal, imag: paddedImag };
  };

  const leftPadded = padChannel(trackSpec.leftReal, trackSpec.leftImag);
  const rightPadded = padChannel(trackSpec.rightReal, trackSpec.rightImag);

  const centerPad = FFT_SIZE / 2;
  const pad = Math.floor(hopLength / 2) * 3;
  const istftLength = (paddedFrames - 1) * hopLength + FFT_SIZE;

  const leftOut = istft(leftPadded.real, leftPadded.imag, paddedFrames, paddedBins, FFT_SIZE, hopLength, istftLength);
  const rightOut = istft(rightPadded.real, rightPadded.imag, paddedFrames, paddedBins, FFT_SIZE, hopLength, istftLength);

  const totalOffset = centerPad + pad;
  const left = leftOut.subarray(totalOffset, totalOffset + targetLength);
  const right = rightOut.subarray(totalOffset, totalOffset + targetLength);

  return { left: new Float32Array(left), right: new Float32Array(right) };
}

/**
 * Prepare model input from stereo audio
 */
function prepareModelInput(leftChannel, rightChannel) {
  const inputLength = TRAINING_SAMPLES;

  const paddedLeft = new Float32Array(inputLength);
  const paddedRight = new Float32Array(inputLength);
  const copyLen = Math.min(leftChannel.length, inputLength);
  paddedLeft.set(leftChannel.subarray(0, copyLen));
  paddedRight.set(rightChannel.subarray(0, copyLen));

  const le = Math.ceil(inputLength / HOP_SIZE);
  const pad = Math.floor(HOP_SIZE / 2) * 3;
  const padRight = pad + le * HOP_SIZE - inputLength;

  const stftInputLeft = reflectPad(paddedLeft, pad, padRight);
  const stftInputRight = reflectPad(paddedRight, pad, padRight);

  const centerPad = FFT_SIZE / 2;
  const centeredLeft = reflectPad(stftInputLeft, centerPad, centerPad);
  const centeredRight = reflectPad(stftInputRight, centerPad, centerPad);

  const stftLeft = stft(centeredLeft, FFT_SIZE, HOP_SIZE);
  const stftRight = stft(centeredRight, FFT_SIZE, HOP_SIZE);

  const numBins = MODEL_SPEC_BINS;
  const numFrames = MODEL_SPEC_FRAMES;
  const frameOffset = 2;

  const magSpec = new Float32Array(4 * numBins * numFrames);

  for (let f = 0; f < numFrames; f++) {
    const srcFrame = f + frameOffset;
    for (let b = 0; b < numBins; b++) {
      const srcIdx = srcFrame * stftLeft.numBins + b;
      magSpec[0 * numBins * numFrames + b * numFrames + f] = stftLeft.real[srcIdx];
      magSpec[1 * numBins * numFrames + b * numFrames + f] = stftLeft.imag[srcIdx];
      magSpec[2 * numBins * numFrames + b * numFrames + f] = stftRight.real[srcIdx];
      magSpec[3 * numBins * numFrames + b * numFrames + f] = stftRight.imag[srcIdx];
    }
  }

  const waveform = new Float32Array(2 * inputLength);
  waveform.set(paddedLeft, 0);
  waveform.set(paddedRight, inputLength);

  return { waveform, magSpec, numBins, numFrames, originalLength: leftChannel.length };
}

/**
 * Main Demucs processor class
 */
class DemucsProcessor {
  constructor(options = {}) {
    this.ort = options.ort || null;
    this.session = null;
    this.modelPath = options.modelPath || './htdemucs_embedded.onnx';
    this.sessionOptions = options.sessionOptions || {};
    this.onProgress = options.onProgress || (() => {});
    this.onLog = options.onLog || (() => {});
    this.onDownloadProgress = options.onDownloadProgress || (() => {});
  }

  async loadModel(modelPathOrBuffer) {
    if (!this.ort) {
      throw new Error('ONNX Runtime not provided. Pass ort in constructor options.');
    }

    this.onLog('model', 'Loading model...');

    let modelBuffer;
    if (modelPathOrBuffer instanceof ArrayBuffer) {
      modelBuffer = modelPathOrBuffer;
    } else {
      const response = await fetch(modelPathOrBuffer || this.modelPath);

      // Check if we can track progress
      const contentLength = response.headers.get('Content-Length');
      if (contentLength && response.body) {
        const totalSize = parseInt(contentLength, 10);
        const reader = response.body.getReader();
        const chunks = [];
        let loadedSize = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loadedSize += value.length;
          this.onDownloadProgress(loadedSize, totalSize);
        }

        // Combine chunks into single ArrayBuffer
        const combined = new Uint8Array(loadedSize);
        let offset = 0;
        for (const chunk of chunks) {
          combined.set(chunk, offset);
          offset += chunk.length;
        }
        modelBuffer = combined.buffer;
      } else {
        // Fallback: no progress tracking
        modelBuffer = await response.arrayBuffer();
      }
    }

    const defaultSessionOptions = {
      executionProviders: ['webgpu', 'wasm'],
      graphOptimizationLevel: 'basic'
    };

    this.session = await this.ort.InferenceSession.create(modelBuffer, {
      ...defaultSessionOptions,
      ...this.sessionOptions
    });

    this.onLog('model', 'Model loaded successfully');
    return this.session;
  }

  async separate(leftChannel, rightChannel) {
    if (!this.session) {
      throw new Error('Model not loaded. Call loadModel() first.');
    }

    const totalSamples = leftChannel.length;
    const stride = Math.floor(TRAINING_SAMPLES * (1 - SEGMENT_OVERLAP));
    const numSegments = Math.ceil((totalSamples - TRAINING_SAMPLES) / stride) + 1;

    const outputs = TRACKS.map(() => ({
      left: new Float32Array(totalSamples),
      right: new Float32Array(totalSamples)
    }));
    const weights = new Float32Array(totalSamples);

    let segmentIdx = 0;

    for (let start = 0; start < totalSamples; start += stride) {
      const end = Math.min(start + TRAINING_SAMPLES, totalSamples);
      const segmentLength = end - start;

      const segLeft = new Float32Array(TRAINING_SAMPLES);
      const segRight = new Float32Array(TRAINING_SAMPLES);

      for (let i = 0; i < segmentLength; i++) {
        segLeft[i] = leftChannel[start + i];
        segRight[i] = rightChannel[start + i];
      }

      const input = prepareModelInput(segLeft, segRight);

      const waveformTensor = new this.ort.Tensor('float32', input.waveform, [1, 2, TRAINING_SAMPLES]);
      const magSpecTensor = new this.ort.Tensor('float32', input.magSpec, [1, 4, MODEL_SPEC_BINS, MODEL_SPEC_FRAMES]);

      const feeds = {};
      feeds[this.session.inputNames[0]] = waveformTensor;
      if (this.session.inputNames.length > 1) {
        feeds[this.session.inputNames[1]] = magSpecTensor;
      }

      const inferResults = await this.session.run(feeds);

      let timeData = null, timeShape = null;
      let freqData = null;

      for (const name of this.session.outputNames) {
        const tensor = inferResults[name];
        if (tensor.dims.length === 4 && tensor.dims[2] === 2) {
          timeData = tensor.data;
          timeShape = tensor.dims;
        } else if (tensor.dims.length === 5 && tensor.dims[2] === 4) {
          freqData = tensor.data;
        }
      }

      if (!timeData) {
        throw new Error('Could not find time-domain output tensor');
      }

      let combinedOutputs = null;
      if (freqData) {
        const trackSpecs = standaloneMask(freqData);
        combinedOutputs = [];

        for (let t = 0; t < 4; t++) {
          const freqOutput = standaloneIspec(trackSpecs[t], TRAINING_SAMPLES);
          const numChannels = timeShape[2];
          const samples = timeShape[3];
          const timeLeft = new Float32Array(samples);
          const timeRight = new Float32Array(samples);

          for (let i = 0; i < samples; i++) {
            timeLeft[i] = timeData[t * numChannels * samples + 0 * samples + i];
            timeRight[i] = timeData[t * numChannels * samples + 1 * samples + i];
          }

          const combined = {
            left: new Float32Array(samples),
            right: new Float32Array(samples)
          };
          for (let i = 0; i < samples; i++) {
            combined.left[i] = timeLeft[i] + (freqOutput.left[i] || 0);
            combined.right[i] = timeRight[i] + (freqOutput.right[i] || 0);
          }
          combinedOutputs.push(combined);
        }
      }

      const numTracks = timeShape[1];
      const numChannels = timeShape[2];
      const samples = timeShape[3];

      const overlapWindow = new Float32Array(segmentLength);
      for (let i = 0; i < segmentLength; i++) {
        const fadeIn = Math.min(i / (stride * 0.5), 1);
        const fadeOut = Math.min((segmentLength - i) / (stride * 0.5), 1);
        overlapWindow[i] = Math.min(fadeIn, fadeOut);
      }

      for (let t = 0; t < numTracks; t++) {
        for (let i = 0; i < segmentLength && start + i < totalSamples; i++) {
          let leftVal, rightVal;
          if (combinedOutputs) {
            leftVal = combinedOutputs[t].left[i];
            rightVal = combinedOutputs[t].right[i];
          } else {
            const leftIdx = t * numChannels * samples + 0 * samples + i;
            const rightIdx = t * numChannels * samples + 1 * samples + i;
            leftVal = timeData[leftIdx];
            rightVal = timeData[rightIdx];
          }
          outputs[t].left[start + i] += leftVal * overlapWindow[i];
          outputs[t].right[start + i] += rightVal * overlapWindow[i];
        }
      }

      for (let i = 0; i < segmentLength && start + i < totalSamples; i++) {
        weights[start + i] += overlapWindow[i];
      }

      segmentIdx++;
      this.onProgress({
        progress: segmentIdx / numSegments,
        currentSegment: segmentIdx,
        totalSegments: numSegments
      });
    }

    for (let t = 0; t < TRACKS.length; t++) {
      for (let i = 0; i < totalSamples; i++) {
        if (weights[i] > 0) {
          outputs[t].left[i] /= weights[i];
          outputs[t].right[i] /= weights[i];
        }
      }
    }

    return {
      drums: outputs[0],
      bass: outputs[1],
      other: outputs[2],
      vocals: outputs[3]
    };
  }
}
return { DemucsProcessor, CONSTANTS };

  let flats;

  else flats = /b/.test(song.raw.match(/\b[A-G]b/) ? 'b' : '');
  const latin = S.settings.notation === 'latin' || (S.settings.notation === 'orig' && song.notation === 'latin');
  return {shift, opts:{flats, latin}};
}
function chordHTML(tok, shift, opts){
  const core = tok.replace(/^[(\[]+|[)\]]+$/g,'');
  if (!parseChord(core)) return `<span class="ch nc">${esc(tok)}</span>`;
  return `<span class="ch">${esc(transposeToken(tok, shift, opts))}</span>`;
}
function songHTML(song){
  const parsed = parseSong(song.raw || '');
  song.notation = parsed.notation;
  const {shift, opts} = displayOpts(song);
  let h = '<div class="song">';
  for (const l of parsed.lines){
    if (l.type === 'blank') h += '<div class="ln blank"></div>';
    else if (l.type === 'section') h += `<div><div class="ln section">${esc(l.text)}</div></div>`;
    else if (l.type === 'lyric') h += `<div class="ln lyric"${l.t != null ? ` data-t="${l.t}"` : ''}>${esc(l.text)}</div>`;
    else if (l.type === 'tab') h += `<div class="ln tab">${esc(l.text)}</div>`;
    else {
      h += `<div class="ln ${l.type}"${l.t != null ? ` data-t="${l.t}"` : ''}>`;
      for (const p of l.parts){
        const ch = p.chord ? chordHTML(p.chord, shift, opts) : '<span class="ch"></span>';
        h += `<span class="seg">${ch}<span class="tx">${esc(p.text) || (l.type==='mixed' ? '' : '')}</span></span>`;
      }
      h += '</div>';
    }
  }
  return h + '</div>';
}
function keyLabel(song){
  const k = parseKey(song.key);
  if (!k) return (song.transpose ? (song.transpose > 0 ? '+' : '') + song.transpose : '0') + ' <small>st</small>';
  const t = song.transpose || 0;
  const latin = S.settings.notation === 'latin' || (S.settings.notation === 'orig' && song.notation === 'latin');
  const idx = mod(k.idx + t, 12);
  const name = noteName(idx, {flats: preferFlats(idx, k.minor), latin}) + (k.minor ? 'm' : '');
  return esc(name) + (t ? ` <small>(${t > 0 ? '+' : ''}${t})</small>` : '');
}
function curSong(){ return S.curId ? S.songs.get(S.curId) : null; }
function renderLyrics(keepRatio){

/* ================= Autoscroll loop ================= */
function scrollTick(){
  const el = $('#lyrics'), d = DECK_CUR(), song = curSong();
  if (Math.abs(S.nudge) > 0.5){ const step = S.nudge * 0.18; S.nudge -= step; el.scrollTop += step; } else S.nudge = 0;
  if (song && d && d.song === song){
    // detect manual scroll since last frame
    if (S.lastSet != null && Math.abs(el.scrollTop - S.lastSet) > 1.5) S.userOffset += el.scrollTop - S.lastSet;
    const tNow = d.time;
    if (S.timed && S.timed.length >= 2 && d.kind !== 'none'){
      // highlight the line being sung
      let idx = -1; for (let i = 0; i < S.timed.length; i++){ if (S.timed[i].t <= tNow + 0.15) idx = i; else break; }
      const nl = idx >= 0 ? S.timed[idx].el : null;
      if (nl !== S.nowLine){ S.nowLine && S.nowLine.classList.remove('now'); nl && nl.classList.add('now'); S.nowLine = nl; }
    }
    if (S.scrollMode === 'auto' && d.playing && S.timed && S.timed.length >= 2 && d.kind !== 'none'){
      // line-accurate sync: interpolate between timed lines
      const T = S.timed; let y;
      const top = e => e.offsetTop + e.offsetHeight * 0.5;
      if (tNow <= T[0].t) y = top(T[0].el) * clamp(tNow / Math.max(0.5, T[0].t), 0, 1);
      else {
        let i = 0; while (i + 1 < T.length && T[i+1].t <= tNow) i++;
        if (i + 1 < T.length){ const a = T[i], b = T[i+1]; y = top(a.el) + (top(b.el) - top(a.el)) * clamp((tNow - a.t) / Math.max(0.3, b.t - a.t), 0, 1); }
        else y = top(T[i].el);
      }
      el.scrollTop = y - el.clientHeight * 0.35 + S.userOffset;
    } else if (S.scrollMode === 'auto' && d.playing){
      const dur = d.duration || songDuration(song);
      const start = song.scrollStart ?? 0, end = song.scrollEnd ?? dur;
      const p = clamp((d.time - start) / Math.max(1, end - start), 0, 1);
      const sEl = el.firstElementChild, C = sEl ? sEl.offsetTop + sEl.offsetHeight : 0;
      const target = p * C - el.clientHeight * 0.35 + S.userOffset; // current line sits on the reading guide (35%)
      el.scrollTop = target;
    }
    S.lastSet = el.scrollTop;
    // auto transition
    if (S.settings.autoFade && d.playing && !S.fading && DECK_NEXT().song && d.duration > 0 && d.kind !== 'none'){
      if (d.duration - d.time <= S.settings.fadeSec + 0.2) transition();
    }
    if (d.kind === 'none' && d.playing && d.time >= d.duration){ d.pause(); d.offset = d.duration; d.onEnded(); }
  }
  for (const dk of DECKS) dk.tick();
  const info = $('#scrollInfo');
  if (song && d){
    const kindTxt = d.kind === 'file' ? 'sincronizado con la pista' : d.kind === 'yt' ? 'sincronizado con YouTube' : 'por tiempo';
    info.textContent = S.scrollMode === 'auto' ? (d.playing ? 'Avanzando · ' + kindTxt : 'En pausa · ' + kindTxt) : 'Manual (pedal / rueda)';
  } else info.textContent = '—';
  $('#speedGroup').classList.toggle('hidden', !(d && d.kind === 'none'));
  loopTick();
  requestAnimationFrame(scrollTick);
}

/* ================= Song / deck flow ================= */
function nextInSetlist(id){
  const i = S.setlist.indexOf(id);
  if (i < 0) return S.setlist[0] && S.setlist[0] !== id ? S.setlist[0] : null;
  return S.setlist[i+1] || null;
}
async function setCurrent(id, {load=true} = {}){
  S.curId = id; saveSetlist();
  renderLyrics(); renderSetlist();
  if (load){ const d = DECK_CUR(); await d.load(S.songs.get(id) || null); }
  if (S.curId !== id) return; // a newer selection superseded this one
  DECKS.forEach(d => d.render());
  const nx = nextInSetlist(id);
  const nd = DECK_NEXT();
  if (!nd.playing && (!nd.song || nd.song.id !== nx)) await nd.load(nx ? S.songs.get(nx) : null);
  renderSetlist(); prunePitchCache();
}
async function setNext(id){
  const nd = DECK_NEXT();
  if (nd.playing){ toast('La pista siguiente está sonando; espera a que termine la transición.'); return; }
  await nd.load(S.songs.get(id)); renderSetlist(); prunePitchCache();
}
async function transition(){
  if (S.fading) return;
  const A = DECK_CUR(), B = DECK_NEXT();
  if (!B.song){ toast('Elige la siguiente canción en el setlist.'); return; }
  if (B.kind === 'file' && !B.buf){ toast('La siguiente pista aún se está preparando…'); return; }
  S.fading = true;
  const fade = A.playing ? S.settings.fadeSec : 0.3;
  B.setLevel(A.playing ? 0 : 1);
  if (!B.playing){ B.offset = 0; await B.play(); }
  curDeckIdx = 1 - curDeckIdx;
  S.curId = B.song.id; saveSetlist();
  renderLyrics(); DECKS.forEach(d => d.render()); renderSetlist();
  const t0 = performance.now(), prog = $('#fadeProg');
  await new Promise(res => {
    const step = () => {
      const x = clamp((performance.now() - t0) / (fade*1000), 0, 1);
      A.setLevel(Math.cos(x * Math.PI/2)); B.setLevel(Math.sin(x * Math.PI/2));
      prog.style.width = (x*100) + '%';
      if (x < 1) setTimeout(step, 30); else res();
    };
    step();
  });
  A.stop(); A.setLevel(1); prog.style.width = '0';
  S.fading = false;
  const nx = nextInSetlist(S.curId);
  await A.load(nx ? S.songs.get(nx) : null);
  DECKS.forEach(d => d.render()); renderSetlist(); prunePitchCache();
}
async function changeTranspose(delta){
  const s = curSong(); if (!s) return;
  s.transpose = delta === 0 ? 0 : clamp((s.transpose||0) + delta, -11, 11);
  await saveSong(s); renderLyrics(true);
  for (const d of DECKS) if (d.song && d.song.id === s.id){
    d.song = s;
    if (d.kind === 'file') { const tok = ++d.token; d.loadPitch(tok).catch(e => d.setStatus('Error: ' + e.message, true)); }
    else if (d.kind === 'yt') d.setStatus(s.transpose ? 'YouTube: suena en tono original' : '', !!s.transpose);
  }
  prunePitchCache();
}

/* ================= Setlist & library ================= */
function trackIcon(s){ return !s.track ? '<span class="tag" title="Sin pista">—</span>' : s.track.type === 'yt' ? '<span class="tag" title="YouTube">▶︎YT</span>' : '<span class="tag" title="Audio">♪</span>'; }
function renderSetlist(){
  const ul = $('#setlist'); const nextId = DECK_NEXT() && DECK_NEXT().song ? DECK_NEXT().song.id : null;
  if (!S.setlist.length){ ul.innerHTML = '<li class="muted" style="cursor:default">El setlist está vacío. Añade canciones desde la biblioteca.</li>'; return; }
  ul.innerHTML = S.setlist.map((id, i) => { const s = S.songs.get(id); if (!s) return '';
    const cls = id === S.curId ? 'cur' : id === nextId ? 'next' : '';
    return `<li class="${cls}" data-id="${id}" title="Clic: preparar como siguiente">
      <span class="n">${i+1}</span><span class="t">${esc(s.title)}</span>${trackIcon(s)}
      <span class="acts"><button data-a="now" title="Abrir ahora">Ahora</button><button data-a="up">▲</button><button data-a="down">▼</button><button data-a="rm" title="Quitar del setlist">✕</button></span></li>`; }).join('');
}
$('#setlist').addEventListener('click', async e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const id = li.dataset.id, a = e.target.dataset.a, i = S.setlist.indexOf(id);
  if (a === 'now'){ if (DECK_CUR().playing && !(await confirmBox('La pista actual está sonando. ¿Abrir esta canción ahora (se detiene la actual)?'))) return; DECK_CUR().stop(); setCurrent(id); }
  else if (a === 'up' && i > 0){ S.setlist.splice(i,1); S.setlist.splice(i-1,0,id); saveSetlist(); renderSetlist(); }
  else if (a === 'down' && i < S.setlist.length-1){ S.setlist.splice(i,1); S.setlist.splice(i+1,0,id); saveSetlist(); renderSetlist(); }
  else if (a === 'rm'){ S.setlist.splice(i,1); saveSetlist(); renderSetlist(); }
  else if (!a){ if (id === S.curId) return; if (!DECK_CUR().song) setCurrent(id); else setNext(id); }
});

function modal(html, {wide=true} = {}){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="${wide ? '' : 'width:min(560px,94vw)'}">${html}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  return {el: ov, close};
}
function confirmBox(msg, ok='Sí', cancel='Cancelar'){
  return new Promise(res => {
    const m = modal(`<div class="mhead"><h2>Confirmar</h2></div><div class="mbody">${esc(msg)}</div>
      <div class="mfoot"><button data-r="0">${esc(cancel)}</button><button class="primary" data-r="1">${esc(ok)}</button></div>`, {wide:false});
    m.el.addEventListener('click', e => { if (e.target.dataset.r != null){ m.close(); res(e.target.dataset.r === '1'); } });
  });
}

    if (a === 'now'){ m.close(); if (!S.setlist.includes(id)) { S.setlist.push(id); } if (DECK_CUR().playing) DECK_CUR().stop(); setCurrent(id); }
    if (a === 'edit'){ m.close(); openEditor(s); }

async function deleteSong(id){
  const s = S.songs.get(id);
  S.songs.delete(id); await DB.del('songs', id);
  if (s && s.track && s.track.assetId && ![...S.songs.values()].some(x => x.track && x.track.assetId === s.track.assetId)) await DB.del('assets', s.track.assetId);
  if (s && s.stems){ await DB.del('assets', s.stems.inst); await DB.del('assets', s.stems.voc); }
  S.setlist = S.setlist.filter(x => x !== id); saveSetlist();
  for (const d of DECKS) if (d.song && d.song.id === id) await d.load(null);
  if (S.curId === id){ S.curId = S.setlist[0] || null; await setCurrent(S.curId); }
  renderSetlist();
}
function blobToDataURL(b){ return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
async function exportBackup(withAudio){
  const data = {app:'escenario', version:1, exported:new Date().toISOString(), songs:[...S.songs.values()], setlist:S.setlist, assets:[]};
  if (withAudio){
    const ids = new Set([...S.songs.values()].filter(s => s.track && s.track.assetId).map(s => s.track.assetId));
    for (const s of S.songs.values()) if (s.stems){ ids.add(s.stems.inst); ids.add(s.stems.voc); }
    PADS.forEach(p => p.assetId && ids.add(p.assetId)); data.pads = PADS;
    for (const id of ids){ const a = await DB.get('assets', id); if (a) data.assets.push({id, name:a.name, type:a.type, data: await blobToDataURL(a.blob)}); }
  }
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'escenario-respaldo-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Respaldo exportado.');
}
async function importBackup(file){
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'escenario') throw new Error('No es un respaldo de Escenario');
    for (const a of data.assets || []){ const blob = await (await fetch(a.data)).blob(); await DB.put('assets', {id:a.id, name:a.name, type:a.type, blob}); }
    for (const s of data.songs || []) await saveSong(s);
    for (const id of data.setlist || []) if (!S.setlist.includes(id) && S.songs.has(id)) S.setlist.push(id);
    if (data.pads){ for (let i = 0; i < 8; i++) if (data.pads[i] && data.pads[i].assetId) PADS[i] = data.pads[i]; savePads(); renderPads(); }
    saveSetlist(); renderSetlist();
    if (!S.curId && S.setlist[0]) setCurrent(S.setlist[0]);
    toast(`Importadas ${(data.songs||[]).length} canciones.`);
  } catch(e){ toast('No se pudo importar: ' + e.message, 4000); }
}

if(this.n>=1024){const out=this.buf;this.port.postMessage({f:this.f0,d:out},[out.buffer]);this.buf=new Float32Array(1024);this.n=0;}return true;}}

function defaultLatencyMs(){ if (!ctx) return 30; return Math.round(((ctx.baseLatency||0.01) + (ctx.outputLatency||0.01)) * 1000 * 2 + 5); }

function onChunk(f, d){

function nowF(){ return Math.round(ctx.currentTime * LOOP.sr); }

  const id = await storeAsset(f); const old = PADS[padLoadSlot].assetId;
  PADS[padLoadSlot] = {assetId:id, name:f.name.replace(/\.[^.]+$/,'').slice(0,24), mode: PADS[padLoadSlot].mode || 'oneshot', vol: PADS[padLoadSlot].vol || 0.9};
  if (old) { DB.del('assets', old); decodedCache.delete(old); }
  savePads(); renderPads(); decodeAsset(id).catch(err => toast('No se pudo leer el audio: ' + err.message));
};
async function padDown(i){
  const p = PADS[i]; if (!p.assetId) return; audio();
  if (p.mode === 'loop' && padVoices[i]){ padStop(i); return; }
  let buf; try { buf = await decodeAsset(p.assetId); } catch(e){ toast('Audio del pad no disponible.'); return; }
  padStop(i, true);
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = p.mode === 'loop';
  const g = ctx.createGain(); g.gain.value = p.vol; s.connect(g).connect(busPads); s.start();
  padVoices[i] = {s, g}; s.onended = () => { if (padVoices[i] && padVoices[i].s === s){ padVoices[i] = null; markPad(i); } };
  markPad(i);
}
function padUp(i){ if (PADS[i].mode === 'gate' && padVoices[i]) padStop(i); }
function padStop(i, quick){ const v = padVoices[i]; if (!v) return; try { v.g.gain.setTargetAtTime(0, ctx.currentTime, quick ? 0.005 : 0.02); v.s.stop(ctx.currentTime + (quick ? 0.03 : 0.12)); } catch(e){} padVoices[i] = null; markPad(i); }
function markPad(i){ const el = $('#pads').children[i]; if (el) el.classList.toggle('on', !!padVoices[i]); }
function stopAllPads(){ PADS.forEach((p,i) => padStop(i)); }
function padConfig(i, anchor){
  document.querySelectorAll('.pop').forEach(x => x.remove());
  const p = PADS[i]; const r = anchor.getBoundingClientRect();
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.style.left = Math.min(r.left, innerWidth - 260) + 'px'; pop.style.top = Math.max(10, r.top - 210) + 'px';
  pop.innerHTML = `<b>Pad ${i+1}</b><input type="text" value="${esc(p.name)}" data-k="name">
    <div class="radio">${['oneshot','loop','gate'].map(m => `<label><input type="radio" name="pm" value="${m}" ${p.mode===m?'checked':''}>${{oneshot:'Una vez', loop:'Loop', gate:'Mantener'}[m]}</label>`).join('')}</div>
    <div class="row"><span class="muted">Vol</span><input type="range" min="0" max="1.5" step="0.01" value="${p.vol}" class="grow" data-k="vol"></div>
    <div class="row"><button data-a="rep">Reemplazar…</button><button data-a="rm">Quitar</button><span class="grow"></span><button data-a="ok" class="primary">Listo</button></div>`;
  document.body.appendChild(pop);
  const close = () => { pop.remove(); document.removeEventListener('pointerdown', outside, true); savePads(); renderPads(); };
  const outside = e => { if (!pop.contains(e.target)) close(); };
  setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
  pop.oninput = e => { const k = e.target.dataset.k; if (k === 'name') p.name = e.target.value; if (k === 'vol'){ p.vol = +e.target.value; if (padVoices[i]) padVoices[i].g.gain.value = p.vol; } if (e.target.name === 'pm'){ p.mode = e.target.value; padStop(i); } };
  pop.onclick = e => { const a = e.target.dataset.a;
    if (a === 'ok') close();
    if (a === 'rep'){ padLoadSlot = i; close(); $('#filePad').click(); }
    if (a === 'rm'){ padStop(i); DB.del('assets', p.assetId); decodedCache.delete(p.assetId); PADS[i] = {assetId:null, name:'', mode:'oneshot', vol:0.9}; close(); } };
}

const AI_URLS = {
  ort: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.webgpu.min.mjs',
  demucs: 'https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx',
  transformers: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2',
  whisper: {small:'onnx-community/whisper-small_timestamped', base:'onnx-community/whisper-base_timestamped'}
};
const anWorker = (() => {
  const src = $('#anlib').textContent + `
    onmessage = e => { const {id, L, R, sr} = e.data;
      try { postMessage({id, result: AN.detectChords(L, R, sr)}); } catch(err){ postMessage({id, error:String(err && err.message || err)}); } };`;
  try { return new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'}))); } catch(e){ return null; }
})();
const anJobs = new Map();
if (anWorker) anWorker.onmessage = e => { const j = anJobs.get(e.data.id); if (!j) return; anJobs.delete(e.data.id); e.data.error ? j.reject(new Error(e.data.error)) : j.resolve(e.data.result); };
function detectChordsAsync(L, R, sr){
  return new Promise((resolve, reject) => { if (!anWorker) return reject(new Error('Sin Worker')); const id = uid(); anJobs.set(id, {resolve, reject}); anWorker.postMessage({id, L, R, sr}); });
}
function encodeWavStereo(L, R, sr){
  const n = L.length, buf = new ArrayBuffer(44 + n*4), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*4, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24, sr, true); v.setUint32(28, sr*4, true); v.setUint16(32,4,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40, n*4, true);
  let o = 44; for (let i = 0; i < n; i++){ v.setInt16(o, clamp(L[i], -1, 1) * 0x7fff, true); v.setInt16(o+2, clamp(R[i], -1, 1) * 0x7fff, true); o += 4; }
  return new Blob([buf], {type:'audio/wav'});
}
async function decodeAt(blob, sr){
  const ab = await blob.arrayBuffer();
  const oc = new OfflineAudioContext(2, 1, sr);
  return await oc.decodeAudioData(ab);
}
async function resampleMono(chs, sr, target){
  const n = chs[0].length, oc = new OfflineAudioContext(1, Math.ceil(n * target / sr), target);
  const b = oc.createBuffer(chs.length, n, sr); chs.forEach((c, i) => b.copyToChannel(c, i));
  const src = oc.createBufferSource(); src.buffer = b; src.connect(oc.destination); src.start();
  return (await oc.startRendering()).getChannelData(0);
}
async function cachedFetch(url, onProg){
  let cache = null; try { cache = await caches.open('escenario-models-v1'); const hit = await cache.match(url); if (hit) return await hit.arrayBuffer(); } catch(e){}
  const resp = await fetch(url); if (!resp.ok) throw new Error('Descarga fallida (' + resp.status + ')');
  const total = +resp.headers.get('Content-Length') || 0; const reader = resp.body.getReader(); const chunks = []; let got = 0;
  for (;;){ const {done, value} = await reader.read(); if (done) break; chunks.push(value); got += value.length; onProg && total && onProg(got / total); }
  const blob = new Blob(chunks);
  try { cache && await cache.put(url, new Response(blob, {headers:{'Content-Type':'application/octet-stream'}})); } catch(e){ console.warn('No se pudo guardar en caché', e); }
  return await blob.arrayBuffer();
}
const AI = {
  ort:null, demucs:null, tf:null, asr:null, asrKey:null,
  async gpuInfo(){ try { const a = navigator.gpu && await navigator.gpu.requestAdapter(); return {ok: !!a, f16: !!(a && a.features.has('shader-f16'))}; } catch(e){ return {ok:false, f16:false}; } },
  async loadDemucs(onProg){
    if (this.demucs) return this.demucs;
    if (!this.ort){ this.ort = await import(AI_URLS.ort); try { this.ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1; } catch(e){} }
    const model = await cachedFetch(AI_URLS.demucs, onProg);
    const gpu = await this.gpuInfo();
    const p = new DEMUCS.DemucsProcessor({ort:this.ort, sessionOptions:{executionProviders: gpu.ok ? ['webgpu','wasm'] : ['wasm'], graphOptimizationLevel:'basic'}});
    await p.loadModel(model);
    this.demucs = p; return p;
  },
  async loadWhisper(quality, onProg){
    const key = quality;
    if (this.asr && this.asrKey === key) return this.asr;
    if (!this.tf) this.tf = await import(AI_URLS.transformers);
    const gpu = await this.gpuInfo();
    const device = gpu.ok ? 'webgpu' : 'wasm';
    const dtype = device === 'webgpu' ? {encoder_model: gpu.f16 && quality === 'small' ? 'fp16' : 'fp32', decoder_model_merged:'q4'} : {encoder_model:'q8', decoder_model_merged:'q8'};
    const files = {};
    this.asr = await this.tf.pipeline('automatic-speech-recognition', AI_URLS.whisper[quality] || AI_URLS.whisper.small, {
      device, dtype,
      progress_callback: p => { if (p.status === 'progress' && p.total){ files[p.file] = [p.loaded, p.total]; const v = Object.values(files); onProg && onProg(v.reduce((a, x) => a + x[0], 0) / v.reduce((a, x) => a + x[1], 0)); } }
    });
    this.asrKey = key; this.device = device; return this.asr;
  }
};
const friendlyErr = e => { const m = String(e && e.message || e); return /fetch|network|load resource|import/i.test(m) ? 'sin conexión a internet o descarga bloqueada' : /webgpu|gpu/i.test(m) ? 'la tarjeta gráfica no está disponible' : /memory|allocation/i.test(m) ? 'memoria insuficiente' : m.slice(0, 80); };
const HALLU = /amara\.org|subt[ií]tulos|gracias por ver|suscr[ií]bete|thanks for watching|^\W*$/i;

/* ---- job panel ---- */
const STEPS = [['prep','Preparar audio'],['dl1','Descargar modelo de voz (solo la 1.ª vez)'],['sep','Separar la voz de la pista'],['save','Guardar pistas separadas'],['chords','Detectar acordes'],['dl2','Descargar modelo de letra (solo la 1.ª vez)'],['lyr','Transcribir la letra'],['asm','Armar la canción']];
function jobPanel(title){
  let host = $('#jobs'); if (!host){ host = document.createElement('div'); host.id = 'jobs'; document.body.appendChild(host); }
  const el = document.createElement('div'); el.className = 'job';
  el.innerHTML = `<div class="row"><b class="grow">Analizando «${esc(title)}»</b><button class="ghost icon jx" title="Cancelar">✕</button></div>
    <div class="steps">${STEPS.map(([k, l]) => `<div data-k="${k}">○ ${l}</div>`).join('')}</div>
    <div class="jbar"><i></i></div><div class="muted jmsg" style="font-size:12px"></div>`;
  host.appendChild(el);
  const api = {
    cancelled:false,
    step(k, pct){ $$('.steps div', el).forEach(d => { const i = STEPS.findIndex(s => s[0] === d.dataset.k), ci = STEPS.findIndex(s => s[0] === k);
      const label = STEPS[i][1];
      if (i < ci){ if (!d.classList.contains('err') && !d.classList.contains('skip')){ d.className = 'done'; d.textContent = '✓ ' + label; } }
      else if (i === ci){ d.className = 'act'; d.textContent = '● ' + label + (pct != null ? ' · ' + Math.round(pct*100) + '%' : ''); } });
      $('.jbar i', el).style.width = ((STEPS.findIndex(s => s[0] === k) + (pct || 0)) / STEPS.length * 100) + '%'; },
    mark(k, cls, note){ const d = $(`.steps [data-k="${k}"]`, el); if (d){ d.className = cls; d.textContent = (cls === 'err' ? '✕ ' : cls === 'skip' ? '– ' : '✓ ') + STEPS.find(s => s[0] === k)[1] + (note ? ' — ' + note : ''); } },
    msg(t){ $('.jmsg', el).textContent = t; },
    finish(text, ok = true){ $('.jbar i', el).style.width = '100%'; api.msg(text); $('.jx', el).textContent = '✓'; $('.jx', el).title = 'Cerrar';
      $('.jx', el).onclick = () => el.remove(); if (ok) setTimeout(() => el.remove(), 15000); },
    el
  };
  $('.jx', el).onclick = () => { api.cancelled = true; api.msg('Cancelando…'); };
  return api;
}

const Analyzer = {
  queue: [], running: null,
  isBusy(id){ return this.running === id || this.queue.includes(id); },
  enqueue(id){ if (this.isBusy(id)) return; this.queue.push(id); renderLyricsIfCur(id); this.pump(); },
  async pump(){
    if (this.running || !this.queue.length) return;
    const id = this.queue.shift(); this.running = id;
    try { await this.run(id); } catch(e){ console.error(e); }
    this.running = null; renderLyricsIfCur(id); this.pump();
  },
  async run(id){
    const song = S.songs.get(id); if (!song || !song.track || song.track.type !== 'file') return;
    const J = jobPanel(song.title);
    const check = () => { if (J.cancelled) throw new Error('__cancel'); };
    const notes = [];
    try {
      J.step('prep');
      const asset = await DB.get('assets', song.track.assetId); if (!asset) throw new Error('No se encontró el audio');
      const ab = await decodeAt(asset.blob, 44100);
      const L = ab.getChannelData(0), R = ab.numberOfChannels > 1 ? ab.getChannelData(1) : ab.getChannelData(0);
      const dur = ab.duration; check();
      if (dur > 15 * 60) throw new Error('El audio dura más de 15 minutos');
      let parts = null;
      // 1) voice separation
      try {
        J.step('dl1', 0); const proc = await (window.__AI_MOCK ? window.__AI_MOCK.demucs() : AI.loadDemucs(p => J.step('dl1', p))); check();
        J.step('sep', 0); const t0 = performance.now();
        proc.onProgress = ({progress}) => { J.step('sep', progress); const el = (performance.now() - t0) / 1000; if (progress > 0.02) J.msg('Faltan aprox. ' + fmtT(el / progress - el)); };
        parts = await proc.separate(L, R); check(); J.msg('');
      } catch(e){
        if (e.message === '__cancel') throw e;
        console.warn('Separación falló', e); J.mark('dl1', 'skip'); J.mark('sep', 'err', 'no disponible'); notes.push('No se pudo separar la voz (' + friendlyErr(e) + '); se usó la mezcla completa.');
      }
      // 2) save stems
      if (parts){
        J.step('save');
        const n = L.length, iL = new Float32Array(n), iR = new Float32Array(n);
        for (const k of ['drums','bass','other']){ const p = parts[k]; for (let i = 0; i < n; i++){ iL[i] += p.left[i]; iR[i] += p.right[i]; } }
        const base = song.title.replace(/[^\w\- ]+/g, '').slice(0, 40) || 'cancion';
        const instId = await storeAsset(new File([encodeWavStereo(iL, iR, 44100)], base + ' (pista).wav', {type:'audio/wav'}));
        const vocId = await storeAsset(new File([encodeWavStereo(parts.vocals.left, parts.vocals.right, 44100)], base + ' (voz).wav', {type:'audio/wav'}));
        const old = song.stems; song.stems = {inst: instId, voc: vocId};
        if (old){ for (const a of [old.inst, old.voc]){ DB.del('assets', a); decodedCache.delete(a); } }
        await saveSong(song);
      } else J.mark('save', 'skip');
      check();
      // 3) chords: bass + other (no drums, no voice) — or full mix
      J.step('chords');
      let cL, cR;
      if (parts){ const n = L.length; cL = new Float32Array(n); cR = new Float32Array(n);
        for (let i = 0; i < n; i++){ cL[i] = parts.bass.left[i] + parts.other.left[i]; cR[i] = parts.bass.right[i] + parts.other.right[i]; } }
      else { cL = L.slice(); cR = R.slice(); }
      const chords = await detectChordsAsync(cL, cR, 44100); check();
      // 4) lyrics
      let words = [];
      try {
        J.step('dl2', 0); const asr = await (window.__AI_MOCK ? window.__AI_MOCK.whisper() : AI.loadWhisper(S.settings.aiQuality, p => J.step('dl2', p))); check();
        J.step('lyr', 0);
        const vocMono = await resampleMono(parts ? [parts.vocals.left, parts.vocals.right] : [L, R], 44100, 16000);
        const phrases = AN_vocalPhrases(vocMono, 16000, parts ? {} : {rel:0.3});
        const lang = S.settings.aiLang;
        let wordMode = true;
        for (let i = 0; i < phrases.length; i++){
          check(); J.step('lyr', i / phrases.length); J.msg(`Frase ${i+1} de ${phrases.length}`);
          const ph = phrases[i], seg = vocMono.subarray(Math.floor(ph.t0 * 16000), Math.floor(ph.t1 * 16000));
          const opts = {task:'transcribe'}; if (lang !== 'auto') opts.language = lang;
          let out = null;
          if (wordMode){ try { out = await asr(seg, {...opts, return_timestamps:'word'}); if (!out || !out.chunks) throw new Error('sin marcas'); } catch(e){ console.warn('Sin marcas por palabra', e); wordMode = false; out = null; } }
          if (out && out.chunks){
            const ws = out.chunks.filter(c => c.text && !HALLU.test(c.text.trim()));
            if (HALLU.test((out.text||'').trim()) && ws.length < 3) continue;
            for (const c of ws){ const a = c.timestamp && c.timestamp[0] != null ? c.timestamp[0] : 0, b = c.timestamp && c.timestamp[1] != null ? c.timestamp[1] : a + 0.3;
              words.push({text:c.text, ph:i, t0: +(ph.t0 + a).toFixed(2), t1: +(ph.t0 + b).toFixed(2)}); }
          } else {
            const r = await asr(seg, opts); const txt = (r && r.text || '').trim();
            if (!txt || HALLU.test(txt)) continue;
            const ws = txt.split(/\s+/), span = Math.max(0.3, ph.t1 - ph.t0 - 0.3), step = span / ws.length;
            ws.forEach((w, k) => words.push({text:w, ph:i, t0: +(ph.t0 + 0.15 + k*step).toFixed(2), t1: +(ph.t0 + 0.15 + (k+0.9)*step).toFixed(2)}));
          }
        }
        J.msg(''); if (!words.length) notes.push('No se detectó letra cantada.');
      } catch(e){
        if (e.message === '__cancel') throw e;
        console.warn('Transcripción falló', e); J.mark('lyr', 'err', 'no disponible'); notes.push('No se pudo transcribir la letra (' + friendlyErr(e) + ').');
      }
      check();
      // 5) assemble
      J.step('asm');
      const raw = AN_assemble({title: song.title, artist: song.artist, chords, words, duration: dur});
      const fresh = S.songs.get(id) || song;
      const hadText = !!(fresh.raw && fresh.raw.trim());
      if (words.length || !hadText){
        if (hadText) fresh.rawBackup = fresh.raw;
        fresh.raw = raw; fresh.key = chords.key || fresh.key; fresh.notation = 'letter';
      } else notes.push('Se conservó tu letra porque no se pudo transcribir; la versión detectada (solo acordes) quedó guardada para consultar.');
      if (!words.length && hadText) fresh.rawBackup = raw;
      fresh.stems = song.stems || fresh.stems;
      fresh.analysis = {date: new Date().toISOString(), chords: chords.segments, key: chords.key, words, model: S.settings.aiQuality, separated: !!parts};
      fresh.scrollStart = null; fresh.scrollEnd = null;
      await saveSong(fresh);
      for (const d of DECKS) if (d.song && d.song.id === id){ if (!d.playing) await d.load(fresh); else { d.song = fresh; toast('La voz separada se activará cuando detengas la pista.'); } }
      renderLyricsIfCur(id); renderSetlist();
      J.mark('asm', 'done');
      J.finish(notes.length ? notes.join(' ') + ' Revisa y corrige en ✎ Editar.' : 'Listo. Revisa la letra y los acordes en ✎ Editar; la detección automática no es perfecta.', !notes.length);
    } catch(e){
      if (e.message === '__cancel'){ J.finish('Análisis cancelado.', true); return; }
      console.error(e); J.finish('Error: ' + friendlyErr(e), false);
    }
  }
};

        <kbd>V</kbd><span>Silenciar / activar la voz original (canciones analizadas)</span>
      </div>
      <p class="muted" style="font-size:12px;margin-top:16px">Pistas, letras y sonidos se guardan solo en este navegador. Exporta un respaldo desde la Biblioteca de vez en cuando.<br>Cambio de tono: SoundTouch (LGPL 2.1), © Olli Parviainen y colaboradores.</p>
    </div>
    <div class="mfoot"><button class="primary" id="sClose">Listo</button></div>`, {wide:false});
  const q = x => $(x, m.el);
  q('#sTheme').value = st.theme; q('#sNot').value = st.notation; q('#sLat').value = st.latencyMs ?? defaultLatencyMs(); q('#sLatEst').textContent = defaultLatencyMs();
  q('#sTheme').onchange = e => { st.theme = e.target.value; applyTheme(); saveSettings(); };
  const cs = getComputedStyle(document.documentElement);
  const toHex = c => { const d = document.createElement('div'); d.style.color = c; document.body.appendChild(d); const m = getComputedStyle(d).color.match(/\d+/g); d.remove(); return m ? '#' + m.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('') : '#000000'; };
  q('#sChord').value = st.chordColor || toHex(cs.getPropertyValue('--accent').trim());
  q('#sLyric').value = st.lyricColor || toHex(cs.getPropertyValue('--text').trim());
  q('#sChord').oninput = e => { st.chordColor = e.target.value; applyColors(); saveSettings(); };
  q('#sLyric').oninput = e => { st.lyricColor = e.target.value; applyColors(); saveSettings(); };
  q('#sChordR').onclick = () => { st.chordColor = null; applyColors(); saveSettings(); q('#sChord').value = toHex(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()); };
  q('#sLyricR').onclick = () => { st.lyricColor = null; applyColors(); saveSettings(); q('#sLyric').value = toHex(getComputedStyle(document.documentElement).getPropertyValue('--text').trim()); };
  q('#sLang').value = st.aiLang; q('#sQual').value = st.aiQuality;
  q('#sLang').onchange = e => { st.aiLang = e.target.value; saveSettings(); };
  q('#sQual').onchange = e => { st.aiQuality = e.target.value; saveSettings(); };
  const info = async () => { try { if (navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); q('#sModelsInfo').textContent = 'Espacio usado por la app: ' + (e.usage/1e6).toFixed(0) + ' MB'; } } catch(e){} };
  info();
  q('#sClearModels').onclick = async () => { try { for (const k of await caches.keys()) await caches.delete(k); toast('Modelos borrados. Se descargarán de nuevo la próxima vez.'); info(); } catch(e){ toast('No se pudieron borrar: ' + e.message); } };
  q('#sNot').onchange = e => { st.notation = e.target.value; saveSettings(); renderLyrics(true); };
  q('#sLat').onchange = e => { st.latencyMs = e.target.value === '' ? null : +e.target.value; saveSettings(); };
  q('#sClose').onclick = m.close;
}

/* ================= Wiring ================= */
$('#btnLib').onclick = openLibrary; $('#btnAddSet').onclick = openLibrary;
$('#btnSettings').onclick = openSettings;
$('#btnTheme').onclick = () => { const cur = document.documentElement.dataset.theme; S.settings.theme = cur === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); };
$('#tUp').onclick = () => changeTranspose(1); $('#tDown').onclick = () => changeTranspose(-1); $('#tReset').onclick = () => changeTranspose(0);
$('#capo').innerHTML = Array.from({length:10}, (_, i) => `<option value="${i}">${i}</option>`).join('');
$('#capo').onchange = async e => { const s = curSong(); if (!s) return; s.capo = +e.target.value; await saveSong(s); renderLyrics(true); };
$('#fUp').onclick = () => { S.settings.fontSize = clamp(S.settings.fontSize + 2, 14, 56); applyFont(); saveSettings(); };
$('#fDown').onclick = () => { S.settings.fontSize = clamp(S.settings.fontSize - 2, 14, 56); applyFont(); saveSettings(); };
$('#scrollMode').onclick = () => { S.scrollMode = S.scrollMode === 'auto' ? 'manual' : 'auto'; $('#scrollMode').textContent = 'Scroll: ' + (S.scrollMode === 'auto' ? 'Auto' : 'Manual'); };
$('#spUp').onclick = () => setSpeed(S.speed + 0.1); $('#spDown').onclick = () => setSpeed(S.speed - 0.1);
function setSpeed(v){ const d = DECK_CUR(); const t = d.time; S.speed = clamp(Math.round(v*10)/10, 0.3, 3); if (d.kind === 'none' && d.playing){ d.offset = t; d.clockStart = performance.now(); } $('#spVal').textContent = S.speed.toFixed(1) + '×'; }
$('#markStart').onclick = async () => { const s = curSong(), d = DECK_CUR(); if (!s) return; s.scrollStart = Math.round(d.time*10)/10; if (s.scrollEnd != null && s.scrollEnd <= s.scrollStart) s.scrollEnd = null; await saveSong(s); S.userOffset = 0; renderMarks(d); toast('Inicio de letra marcado en ' + fmtT(s.scrollStart)); };
$('#markEnd').onclick = async () => { const s = curSong(), d = DECK_CUR(); if (!s) return; const t = Math.round(d.time*10)/10; if (s.scrollStart != null && t <= s.scrollStart){ toast('El fin debe ser después del inicio.'); return; } s.scrollEnd = t; await saveSong(s); S.userOffset = 0; renderMarks(d); toast('Fin de letra marcado en ' + fmtT(t)); };
$('#markReset').onclick = async () => { const s = curSong(); if (!s) return; s.scrollStart = null; s.scrollEnd = null; await saveSong(s); renderMarks(DECK_CUR()); toast('Sincronía restablecida.'); };
$('#btnEdit').onclick = () => { const s = curSong(); s ? openEditor(s) : openEditor(); };
$('#btnFade').onclick = () => transition();
$('#fadeSec').oninput = e => { S.settings.fadeSec = +e.target.value; $('#fadeSecVal').textContent = S.settings.fadeSec + 's'; saveSettings(); };
$('#autoFade').onchange = e => { S.settings.autoFade = e.target.checked; saveSettings(); };
$('#btnMic').onclick = () => enableMic(S.settings.micDev);
$('#micDev').onchange = e => { S.settings.micDev = e.target.value; saveSettings(); $('#btnMic').disabled = false; enableMic(e.target.value); };
$('#micCh').onchange = e => { S.settings.micCh = e.target.value; saveSettings(); LOOP.node && LOOP.node.port.postMessage({ch:e.target.value}); };
$('#monitor').onchange = e => { if (LOOP.monitor) LOOP.monitor.gain.setTargetAtTime(e.target.checked ? 1 : 0, ctx.currentTime, 0.02); };
$('#btnLoopReset').onclick = async () => { if (LOOP.tracks.some(t => t.data) && !(await confirmBox('¿Borrar todos los loops?', 'Borrar'))) return; loopResetAll(); };
$('#btnCollapse').onclick = () => { S.settings.footer = !S.settings.footer; applyFooter(); saveSettings(); };
function applyFooter(){ $('#footer').classList.toggle('collapsed', !S.settings.footer); $('#btnCollapse').textContent = S.settings.footer ? '▾ Ocultar' : '▴ Mostrar'; }
$('#btnPadStop').onclick = () => { stopAllPads(); stopAllLoops(); };

document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]') || document.querySelector('.overlay') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, el = $('#lyrics');
  if (k === ' '){ e.preventDefault(); const d = DECK_CUR(); if (d.song) d.toggle(); }
  else if (k === 't' || k === 'T' || k === 'ArrowRight'){ e.preventDefault(); transition(); }
  else if (k === 'ArrowDown' || k === 'PageDown'){ e.preventDefault(); S.nudge += el.clientHeight * (k === 'PageDown' ? 0.6 : 0.25); }
  else if (k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); S.nudge -= el.clientHeight * (k === 'PageUp' ? 0.6 : 0.25); }
  else if (k === '+' || k === '='){ changeTranspose(1); }
  else if (k === '-' || k === '_'){ changeTranspose(-1); }
  else if (/^Digit[1-4]$/.test(e.code)){ e.preventDefault(); const i = +e.code.slice(5) - 1; if (e.shiftKey) trackMute(i); else trackPress(i); }
  else if (k === 'Escape'){ stopAllPads(); stopAllLoops(); }
  else if (k === 'v' || k === 'V'){ const d = DECK_CUR(); if (d.hasStems) d.toggleVoice(); else toast('Esta canción no tiene la voz separada. Analízala desde ✎ Editar.'); }
  else { const i = PAD_KEYS.indexOf(k.toLowerCase()); if (i >= 0 && !e.repeat) padDown(i); }
});
document.addEventListener('keyup', e => { const i = PAD_KEYS.indexOf((e.key||'').toLowerCase()); if (i >= 0) padUp(i); });
document.addEventListener('mouseup', e => { const b = e.target.closest('button'); if (b) setTimeout(() => b.blur(), 0); });
document.addEventListener('keyup', e => { if (e.key === ' ' && !e.target.closest('input,textarea,select')) e.preventDefault(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ================= Boot ================= */
(async function boot(){
  await DB.open();
  const st = await DB.kvGet('settings', null); if (st) Object.assign(S.settings, st);
  applyTheme(); applyFont(); applyFooter(); applyColors();
  $('#fadeSec').value = S.settings.fadeSec; $('#fadeSecVal').textContent = S.settings.fadeSec + 's'; $('#autoFade').checked = S.settings.autoFade;
  for (const s of await DB.all('songs')) S.songs.set(s.id, s);
  S.setlist = (await DB.kvGet('setlist', [])).filter(id => S.songs.has(id));
  const pads = await DB.kvGet('pads', null); if (pads) PADS = pads.map(p => ({assetId:null, name:'', mode:'oneshot', vol:0.9, ...p}));
  LOOP.tracks = Array.from({length:4}, (_, i) => ({idx:i, data:null, undo:null, state:'empty', src:null, g:null, vol:0.9}));
  DECKS = [new Deck(0), new Deck(1)];
  renderPads(); renderTracks();
  if (location.protocol === 'file:'){
    const b = document.createElement('div'); b.className = 'banner';
    b.textContent = 'Estás abriendo Escenario como archivo local: YouTube y el micrófono no funcionarán. Ábrelo desde un servidor (GitHub Pages, o "python3 -m http.server" en esta carpeta → http://localhost:8000).';
    document.body.insertBefore(b, document.body.firstChild); document.body.style.gridTemplateRows = 'auto 56px minmax(0,1fr) auto';
    $('header').style.gridRow = '2'; $('main').style.gridRow = '3'; $('aside').style.gridRow = '3'; $('#footer').style.gridRow = '4';
  }
  const cur = await DB.kvGet('curId', null);
  const first = cur && S.songs.has(cur) ? cur : (S.setlist[0] || null);
  if (first) await setCurrent(first); else { renderLyrics(); renderSetlist(); DECKS.forEach(d => d.render()); }
  // AudioContext needs a gesture; create lazily on first interaction
  document.addEventListener('pointerdown', () => audio(), {once:true});
  requestAnimationFrame(scrollTick);
  window.__booted = true;
})();
</script>
